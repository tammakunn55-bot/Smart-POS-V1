 <section class="panel"><div class="panel-title"><h4>ประวัติรับสินค้า</h4><span class="muted">${purchaseReceipts.length} รายการ</span></div>${purchaseReceipts.length?`<div class="table-wrap"><table><thead><tr><th>เลขที่ใบรับ</th><th>ใบสั่งซื้อ</th><th>ผู้จำหน่าย</th><th>วันที่รับ</th><th>จำนวนรายการ</th><th style="text-align:right">มูลค่ารับเข้า</th></tr></thead><tbody>${purchaseReceipts.map(r=>`<tr><td><strong>${esc(r.receipt_no)}</strong></td><td>${esc(r.po_no||'-')}</td><td>${esc(r.supplier_name||'-')}</td><td>${new Date(r.received_at).toLocaleString('th-TH')}</td><td>${r.item_count}</td><td style="text-align:right">฿${money(r.total_cost)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ประวัติรับสินค้าจะแสดงหลังบันทึกการรับครั้งแรก</div>'}</section>`;
 }catch(e){c.innerHTML=`<section class="panel"><div class="empty"><span>⚠️</span>โหลดข้อมูลจัดซื้อไม่สำเร็จ<p>${esc(e.message)}</p><button class="btn-primary" onclick="purchasingPage(document.getElementById('content'))">ลองอีกครั้ง</button></div></section>`}
}
function supplierModal(){openModal(`<h3>เพิ่มผู้จำหน่าย</h3><div class="form-grid"><div class="form-item full"><label>ชื่อผู้จำหน่าย *</label><input class="field" id="supName" maxlength="200" placeholder="ชื่อบริษัท / ร้านค้า"></div><div class="form-item"><label>เบอร์โทรศัพท์</label><input class="field" id="supPhone" maxlength="50"></div><div class="form-item"><label>เลขประจำตัวผู้เสียภาษี</label><input class="field" id="supTax" maxlength="50"></div><div class="form-item full"><label>ที่อยู่</label><input class="field" id="supAddress" maxlength="500"></div><div class="form-item full"><label>หมายเหตุ</label><input class="field" id="supNote" maxlength="500"></div></div><div class="modal-actions"><button class="btn-outline" onclick="closeModal()">ยกเลิก</button><button class="btn-primary" onclick="saveSupplier()">บันทึกผู้จำหน่าย</button></div>`)}
async function saveSupplier(){const name=document.getElementById('supName').value.trim();if(!name)return toast('กรุณาระบุชื่อผู้จำหน่าย');try{await apiRequest('/api/v1/suppliers',{method:'POST',body:JSON.stringify({name,phone:document.getElementById('supPhone').value.trim(),tax_id:document.getElementById('supTax').value.trim(),address:document.getElementById('supAddress').value.trim(),note:document.getElementById('supNote').value.trim()})});closeModal();await purchasingPage(document.getElementById('content'));toast('เพิ่มผู้จำหน่ายแล้ว')}catch(e){toast('บันทึกผู้จำหน่ายไม่สำเร็จ: '+e.message)}}
function purchaseOrderModal(){if(!db.products.length)return toast('ไม่พบสินค้า กรุณาเพิ่มสินค้าก่อน');orderLineCount=1;openModal(`<h3>สร้างใบสั่งซื้อ</h3><div class="form-grid"><div class="form-item full"><label>ผู้จำหน่าย</label><select class="field" id="poSupplier"><option value="">ไม่ระบุผู้จำหน่าย</option>${purchaseSuppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="form-item full"><label>หมายเหตุ</label><input class="field" id="poNote" maxlength="500" placeholder="เช่น รอบส่งของ / เลขที่ใบเสนอราคา"></div></div><div class="panel-title" style="margin-top:20px"><h4>รายการสินค้า</h4><button class="btn-soft" onclick="addOrderLine()">＋ เพิ่มรายการ</button></div><div id="poLines">${orderLineHtml(0)}</div><div class="modal-actions"><button class="btn-outline" onclick="closeModal()">ยกเลิก</button><button class="btn-primary" onclick="savePurchaseOrder()">สร้างใบสั่งซื้อ</button></div>`)}
function orderLineHtml(i){return `<div class="form-grid" id="poLine${i}" style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="form-item full"><label>สินค้า</label><select class="field" id="poProduct${i}">${db.products.map(p=>`<option value="${p.id}">${esc(p.sku)} — ${esc(p.name)}${p.variantName?' · '+esc(p.variantName):''} (${esc(p.unit)})</option>`).join('')}</select></div><div class="form-item"><label>จำนวนสั่ง</label><input class="field" id="poQty${i}" type="number" min="0.001" step="0.001" value="1"></div><div class="form-item"><label>ต้นทุนต่อหน่วย (บาท)</label><input class="field" id="poCost${i}" type="number" min="0" step="0.01" value="${Number(db.products[0]?.cost||0)}"></div></div>`}
function addOrderLine(){if(orderLineCount>=200)return toast('เพิ่มได้ไม่เกิน 200 รายการ');const i=orderLineCount++;document.getElementById('poLines').insertAdjacentHTML('beforeend',orderLineHtml(i))}
async function savePurchaseOrder(){const items=[];for(let i=0;i<orderLineCount;i++){const el=document.getElementById('poProduct'+i);if(!el)continue;const quantity=Number(document.getElementById('poQty'+i).value),unit_cost=Number(document.getElementById('poCost'+i).value);if(!Number.isFinite(quantity)||quantity<=0||!Number.isFinite(unit_cost)||unit_cost<0)return toast('ตรวจสอบจำนวนสั่งและต้นทุนให้ถูกต้อง');items.push({variant_id:el.value,quantity,unit_cost})}if(!items.length)return toast('กรุณาเพิ่มรายการสินค้า');if(new Set(items.map(x=>x.variant_id)).size!==items.length)return toast('สินค้าเดียวกันซ้ำหลายบรรทัด กรุณารวมจำนวนไว้บรรทัดเดียว');try{const result=await apiRequest('/api/v1/purchase-orders',{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({supplier_id:document.getElementById('poSupplier').value||null,note:document.getElementById('poNote').value.trim(),items})});closeModal();await purchasingPage(document.getElementById('content'));toast('สร้างใบสั่งซื้อ '+(result.purchase_order?.po_no||'สำเร็จ')+' แล้ว')}catch(e){toast('สร้างใบสั่งซื้อไม่สำเร็จ: '+e.message)}}
function receiveOrder(id){const o=purchaseOrders.find(x=>x.id===id);if(!o)return toast('ไม่พบใบสั่งซื้อ');const items=(o.items||[]).map((it,i)=>({...it,remaining:Math.max(0,Number(it.quantity_ordered)-Number(it.quantity_received)),index:i})).filter(it=>it.remaining>0);if(!items.length)return toast('ใบสั่งซื้อนี้รับครบแล้ว');openModal(`<h3>รับสินค้า · ${esc(o.po_no)}</h3><p class="settings-note">กรอกจำนวนที่รับจริง สามารถรับบางส่วนได้ และห้ามเกินจำนวนค้างรับ</p><div class="table-wrap"><table><thead><tr><th>สินค้า</th><th>ค้างรับ</th><th>รับครั้งนี้</th><th>ต้นทุน/หน่วย</th></tr></thead><tbody>${items.map((it,i)=>`<tr><td><strong>${esc(it.product_name)}</strong><div class="muted">${esc(it.sku)} · ${esc(it.unit_name)}</div></td><td>${it.remaining}</td><td><input class="field" style="min-width:90px" type="number" id="rcQty${i}" min="0" max="${it.remaining}" step="0.001" value="${it.remaining}"></td><td><input class="field" style="min-width:100px" type="number" id="rcCost${i}" min="0" step="0.01" value="${Number(it.unit_cost)}"></td></tr>`).join('')}</tbody></table></div><div class="modal-actions"><button class="btn-outline" onclick="closeModal()">ยกเลิก</button><button class="btn-primary" onclick="saveReceipt('${o.id}',${JSON.stringify(items.map(it=>({variant_id:it.variant_id,remaining:it.remaining,index:it.index}))).replace(/"/g,'&quot;').replace(/</g,'&lt;')})">ยืนยันรับสินค้า</button></div>`)}
async function saveReceipt(orderId,items){const payload=[];for(let i=0;i<items.length;i++){const quantity=Number(document.getElementById('rcQty'+i).value),unit_cost=Number(document.getElementById('rcCost'+i).value);if(!Number.isFinite(quantity)||quantity<0||quantity>items[i].remaining||!Number.isFinite(unit_cost)||unit_cost<0)return toast('จำนวนรับหรือต้นทุนไม่ถูกต้อง');if(quantity>0)payload.push({variant_id:items[i].variant_id,quantity,unit_cost})}if(!payload.length)return toast('กรุณาระบุจำนวนรับอย่างน้อย 1 รายการ');try{const result=await apiRequest('/api/v1/purchase-orders/'+encodeURIComponent(orderId)+'/receive',{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({items:payload})});await refreshApiData(false);closeModal();await purchasingPage(document.getElementById('content'));toast('รับสินค้าเข้าสต็อกแล้ว · '+(result.receipt?.receipt_no||''))}catch(e){toast('รับสินค้าไม่สำเร็จ: '+e.message)}}

async function loadUsers(){const root=document.getElementById('usersTable');if(!root)return;try{const r=await apiRequest('/api/v1/users');root.innerHTML=r.items?.length?`<div class="table-wrap"><table><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อแสดงผล</th><th>บทบาท</th><th>สถานะ</th><th>เข้าสู่ระบบล่าสุด</th><th>จัดการ</th></tr></thead><tbody>${r.items.map(u=>`<tr><td><strong>${esc(u.username)}</strong></td><td>${esc(u.display_name)}</td><td><select class="field" style="min-width:145px" id="role-${u.id}" ${u.id===currentApiUser?.id?'disabled':''}>${Object.entries(roleNames).map(([k,v])=>`<option value="${k}" ${u.role===k?'selected':''}>${v}</option>`).join('')}</select></td><td><span class="pill ${u.is_active?'':'bad'}">${u.is_active?'ใช้งาน':'ปิดใช้งาน'}</span></td><td>${u.last_login_at?new Date(u.last_login_at).toLocaleString('th-TH'):'ยังไม่เคย'}</td><td><div class="toolbar"><button class="btn-soft" onclick="saveUserRole('${u.id}',${u.is_active})" ${u.id===currentApiUser?.id?'disabled':''}>บันทึกบทบาท</button><button class="btn-outline" onclick="resetUserPin('${u.id}','${esc(u.username)}')">รีเซ็ต PIN</button><button class="${u.is_active?'btn-danger':'btn-soft'}" onclick="toggleUser('${u.id}',${!u.is_active})" ${u.id===currentApiUser?.id?'disabled':''}>${u.is_active?'ปิดบัญชี':'เปิดบัญชี'}</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ไม่พบผู้ใช้</div>'}catch(e){root.innerHTML=`<div class="empty">โหลดบัญชีไม่ได้: ${esc(e.message)}</div>`}}
function newUserModal(){openModal(`<h3>เพิ่มบัญชีพนักงาน</h3><div class="form-grid"><div class="form-item"><label>ชื่อผู้ใช้ (3-40 ตัวอักษร)</label><input class="field" id="newUsername" autocomplete="off"></div><div class="form-item"><label>ชื่อแสดงผล</label><input class="field" id="newDisplayName"></div><div class="form-item"><label>PIN 4-8 หลัก</label><input class="field" id="newPin" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div><div class="form-item"><label>บทบาท</label><select class="field" id="newRole">${Object.entries(roleNames).map(([k,v])=>`<option value="${k}" ${k==='cashier'?'selected':''}>${v}</option>`).join('')}</select></div></div><p class="settings-note">PIN ใช้สำหรับเข้าสู่ระบบ ห้ามใช้ PIN ที่เดาง่ายหรือใช้ร่วมกัน</p><div class="modal-actions"><button class="btn-outline" onclick="closeModal()">ยกเลิก</button><button class="btn-primary" onclick="createUser()">สร้างบัญชี</button></div>`)}
async function createUser(){const payload={username:document.getElementById('newUsername').value.trim(),display_name:document.getElementById('newDisplayName').value.trim(),pin:document.getElementById('newPin').value,role:document.getElementById('newRole').value};try{await apiRequest('/api/v1/users',{method:'POST',body:JSON.stringify(payload)});closeModal();await loadUsers();toast('สร้างบัญชีผู้ใช้แล้ว')}catch(e){toast('สร้างบัญชีไม่สำเร็จ: '+e.message)}}
async function saveUserRole(id,isActive){const role=document.getElementById('role-'+id)?.value;try{await apiRequest('/api/v1/users/'+id,{method:'PATCH',body:JSON.stringify({role,is_active:isActive})});await loadUsers();toast('บันทึกบทบาทแล้ว ผู้ใช้ต้องเข้าสู่ระบบใหม่')}catch(e){toast('บันทึกบทบาทไม่สำเร็จ: '+e.message)}}
async function toggleUser(id,isActive){if(!confirm(isActive?'เปิดใช้งานบัญชีนี้?':'ปิดใช้งานบัญชีนี้?'))return;try{await apiRequest('/api/v1/users/'+id,{method:'PATCH',body:JSON.stringify({is_active:isActive})});await loadUsers();toast(isActive?'เปิดบัญชีแล้ว':'ปิดบัญชีแล้ว')}catch(e){toast('เปลี่ยนสถานะไม่สำเร็จ: '+e.message)}}
function resetUserPin(id,username){openModal(`<h3>รีเซ็ต PIN</h3><p>บัญชี ${esc(username)} จะต้องเข้าสู่ระบบใหม่หลังเปลี่ยน PIN</p><div class="form-item"><label>PIN ใหม่ 4-8 หลัก</label><input class="field" id="resetPinValue" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div><div class="modal-actions"><button class="btn-outline" onclick="closeModal()">ยกเลิก</button><button class="btn-primary" onclick="submitResetPin('${id}')">บันทึก PIN ใหม่</button></div>`)}
async function submitResetPin(id){const pin=document.getElementById('resetPinValue').value;try{await apiRequest('/api/v1/users/'+id,{method:'PATCH',body:JSON.stringify({pin})});closeModal();await loadUsers();toast('รีเซ็ต PIN แล้ว')}catch(e){toast('รีเซ็ต PIN ไม่สำเร็จ: '+e.message)}}
async function loadAuditLogs(){const root=document.getElementById('auditTable');if(!root)return;try{const r=await apiRequest('/api/v1/audit-logs?limit=50');root.innerHTML=r.items?.length?`<div class="table-wrap"><table><thead><tr><th>วันเวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th>รายการ</th><th>ผล</th><th>รายละเอียด</th></tr></thead><tbody>${r.items.map(x=>`<tr><td>${new Date(x.occurred_at).toLocaleString('th-TH')}</td><td>${esc(x.actor_username||'ระบบ')}</td><td>${esc(x.action)}</td><td>${esc(x.entity_type||'—')}</td><td>${esc(x.outcome)}</td><td>${esc(x.summary||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ยังไม่มีประวัติ</div>'}catch(e){root.innerHTML=`<div class="empty">โหลดประวัติไม่ได้: ${esc(e.message)}</div>`}}
function settingsPage(c){c.innerHTML=`<div class="pagehead"><div><h3>ตั้งค่าร้าน</h3><p>ข้อมูลร้านค้าและการจัดการข้อมูลในอุปกรณ์นี้</p></div><button class="btn-primary" onclick="saveSettings()">บันทึกการตั้งค่า</button></div><div class="panel" style="max-width:760px"><div class="panel-title"><h4>ข้อมูลหน้าร้าน</h4></div><div class="form-grid"><div class="form-item full"><label>ชื่อร้าน</label><input class="field" id="shopName" value="${esc(db.shop.name)}"></div><div class="form-item"><label>เบอร์โทรศัพท์</label><input class="field" id="shopPhone" value="${esc(db.shop.phone)}"></div><div class="form-item"><label>ข้อความท้ายใบเสร็จ</label><input class="field" id="shopFooter" value="${esc(db.shop.footer)}"></div><div class="form-item full"><label>ที่อยู่ร้าน</label><input class="field" id="shopAddress" value="${esc(db.shop.address)}"></div></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><div class="panel-title"><h4>สำรองและกู้คืนข้อมูล</h4></div><p class="settings-note">ข้อมูลของเดโมนี้เก็บไว้ใน Local Storage ของเบราว์เซอร์ปัจจุบันเท่านั้น ไม่ซิงก์ข้ามเครื่อง ควรสำรองไฟล์เป็นประจำ</p><div class="toolbar"><button class="btn-soft" onclick="backupData()">⇩ สำรองข้อมูล JSON</button><label class="btn-outline" style="display:inline-flex;align-items:center;cursor:pointer">⇧ นำเข้าข้อมูล JSON<input type="file" accept=".json,application/json" style="display:none" onchange="restoreData(event)"></label><button class="btn-danger" onclick="resetDemo()">รีเซ็ตข้อมูลตัวอย่าง</button></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h4>เชื่อมต่อฐานข้อมูล PostgreSQL ผ่าน API</h4><p class="settings-note">โหมดเชื่อมต่อ API จะโหลดสินค้าและบันทึกการขาย/ปรับสต็อกที่เซิร์ฟเวอร์ โปรดตั้งค่า backend และฐานข้อมูลให้เรียบร้อยก่อน ข้อมูล Local Storage เดิมจะไม่ถูกนำไปรวมอัตโนมัติ</p><div class="form-grid"><div class="form-item full"><label>API Base URL</label><input class="field" id="apiBaseUrl" placeholder="http://127.0.0.1:8787" value="${esc(localStorage.getItem('hardware_pos_api_url')||'http://127.0.0.1:8787')}"></div><div class="form-item"><label>ชื่อผู้ใช้</label><input class="field" id="apiUsername" autocomplete="username" placeholder="เช่น admin"></div><div class="form-item"><label>PIN 4–8 หลัก</label><input class="field" id="apiPin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8"></div></div><div class="toolbar" style="margin-top:12px"><button class="btn-primary" onclick="connectApi()">เข้าสู่ระบบ API</button><button class="btn-soft" onclick="refreshApiData()">โหลดสินค้า/ยอดขายใหม่</button><button class="btn-outline" onclick="disconnectApi()">ออกจากระบบ API</button></div><p id="apiStatus" class="settings-note"></p><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h4>สถานะระบบ</h4><p class="settings-note">รุ่น 1.8.0 · การ์ดสินค้าหลายรุ่น/ขนาด · บาร์โค้ดและหน่วยขายหลายระดับ · ต้องทดสอบฐานข้อมูล/ความปลอดภัยก่อนใช้จริง</p></div>`}
async function saveSettings(){db.shop.name=document.getElementById('shopName').value.trim()||'ร้านฮาร์ดแวร์';db.shop.phone=document.getElementById('shopPhone').value.trim();db.shop.address=document.getElementById('shopAddress').value.trim();db.shop.footer=document.getElementById('shopFooter').value.trim();if(apiToken){try{await apiRequest('/api/v1/shop',{method:'PATCH',body:JSON.stringify({shop_name:db.shop.name,phone:db.shop.phone,address:db.shop.address,receipt_footer:db.shop.footer})})}catch(e){toast('บันทึกบนเซิร์ฟเวอร์ไม่สำเร็จ: '+e.message);return}}save();document.getElementById('shopBrand').textContent=db.shop.name;render();toast(apiToken?'บันทึกการตั้งค่าร้านลงฐานข้อมูลแล้ว':'บันทึกการตั้งค่าร้านแล้ว')}
function backupData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='hardware-pos-backup.json';a.click();URL.revokeObjectURL(a.href)}
function restoreData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.products||!x.sales||!x.shop)throw 0;db=x;save();render();toast('นำเข้าข้อมูลแล้ว')}catch(_){toast('ไฟล์ไม่ถูกต้อง')}};r.readAsText(f)}
function resetDemo(){if(confirm('ต้องการลบข้อมูลในเครื่องและกลับไปใช้ข้อมูลตัวอย่างหรือไม่?')){db=JSON.parse(JSON.stringify(seed));save();render();toast('รีเซ็ตข้อมูลแล้ว')}}
function openModal(s){document.getElementById('modal').innerHTML=s;document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
let apiToken=localStorage.getItem('hardware_pos_api_token')||'', currentApiUser=null;
const roleNames={owner:'เจ้าของร้าน',manager:'ผู้จัดการ',cashier:'พนักงานขาย',inventory:'พนักงานคลังสินค้า',accountant:'บัญชี'};
function setApiUser(user){currentApiUser=user||null;const name=document.getElementById('userDisplayName'),role=document.getElementById('userRoleLabel'),avatar=document.getElementById('userAvatar');if(name)name.textContent=user?.display_name||'โหมดตัวอย่าง';if(role)role.textContent=user?(roleNames[user.role]||user.role):'ยังไม่ได้เข้าสู่ระบบ API';if(avatar)avatar.textContent=(user?.display_name||'ผ').slice(0,1)}
async function apiRequest(path,options={}){let base=(localStorage.getItem('hardware_pos_api_url')||'http://127.0.0.1:8787').replace(/\/+$/,'');let headers={'Content-Type':'application/json',...(options.headers||{})};if(apiToken)headers.Authorization='Bearer '+apiToken;let response=await fetch(base+path,{...options,headers});let data={};try{data=await response.json()}catch{}if(!response.ok){const err=new Error(data?.error?.message||('HTTP '+response.status));err.status=response.status;err.code=data?.error?.code;throw err}return data}
async function connectApi(){let base=document.getElementById('apiBaseUrl')?.value.trim(),username=document.getElementById('apiUsername')?.value.trim(),pin=document.getElementById('apiPin')?.value.trim();if(!base||!username||!pin)return toast('กรอก API URL ชื่อผู้ใช้ และ PIN ให้ครบ');localStorage.setItem('hardware_pos_api_url',base);try{apiToken='';const result=await apiRequest('/api/v1/auth/login',{method:'POST',body:JSON.stringify({username,pin,device_label:'Hardware POS Browser'})});apiToken=result.session_token;localStorage.setItem('hardware_pos_api_token',apiToken);setApiUser(result.user);await refreshApiData(false);document.getElementById('apiStatus').textContent='เชื่อมต่อแล้ว: '+(result.user?.display_name||result.user?.username)+' ('+(roleNames[result.user?.role]||result.user?.role||'ไม่ระบุบทบาท')+') · โหลดข้อมูลจาก API สำเร็จ';toast('เชื่อมต่อ API สำเร็จ');render()}catch(e){apiToken='';localStorage.removeItem('hardware_pos_api_token');setApiUser(null);document.getElementById('apiStatus').textContent='เชื่อมต่อไม่สำเร็จ: '+e.message;toast('เชื่อมต่อไม่สำเร็จ: '+e.message)}}
async function refreshApiData(showToast=true){if(!apiToken)return toast('กรุณาเข้าสู่ระบบ API ก่อน');try{const results=await Promise.allSettled([apiRequest('/api/v1/products'),apiRequest('/api/v1/sales'),apiRequest('/api/v1/shop')]);for(const r of results)if(r.status==='rejected'&&(r.reason.status!==403)){throw r.reason}const products=results[0].status==='fulfilled'?results[0].value:null,sales=results[1].status==='fulfilled'?results[1].value:null,shop=results[2].status==='fulfilled'?results[2].value:null;if(products)db.products=(products.items||[]).map(x=>({id:x.variant_id,productId:x.product_id,productSku:x.product_sku||x.sku,sku:x.sku,name:x.name,category:'ทั่วไป',unit:x.unit_name||'ชิ้น',barcode:x.barcode||'',cost:Number(x.cost_price||0),price:Number(x.sale_price||0),stock:Number(x.stock||0),min:Number(x.low_stock_threshold||0),emoji:'🔧',variantName:x.variant_name||''}));else db.products=[];if(sales)db.sales=(sales.items||[]).map(x=>({id:x.id,status:x.status,no:x.bill_no,date:x.created_at,items:[],subtotal:Number(x.subtotal||0),discount:Number(x.discount_amount||0),total:Number(x.total_amount||0),payment:Number(x.due_amount||0)>0?'มีเครดิต':'ชำระแล้ว',received:Number(x.paid_amount||0),change:0}));else db.sales=[];if(shop?.shop_name)db.shop={...db.shop,name:shop.shop_name,phone:shop.phone||'',address:shop.address||'',footer:shop.receipt_footer||''};db.cart=db.cart.filter(it=>db.products.some(p=>String(p.id)===String(it.id)));if(!apiToken)return;save();document.getElementById('shopBrand').textContent=db.shop.name;if(showToast)toast('โหลดข้อมูลตามสิทธิ์ผู้ใช้แล้ว');if(page==='settings'){let st=document.getElementById('apiStatus');if(st)st.textContent='เชื่อมต่อ API อยู่ · สินค้า '+db.products.length+' รายการ · บิลล่าสุด '+db.sales.length+' รายการ'}}catch(e){if(e.message.includes('เข้าสู่ระบบ')||e.message.includes('เซสชัน')){apiToken='';localStorage.removeItem('hardware_pos_api_token');setApiUser(null)}throw e}}
async function disconnectApi(){if(apiToken){try{await apiRequest('/api/v1/auth/logout',{method:'POST'})}catch{}}apiToken='';localStorage.removeItem('hardware_pos_api_token');setApiUser(null);toast('ออกจากระบบ API แล้ว');render()}
if(apiToken){apiRequest('/api/v1/auth/me').then(r=>setApiUser(r.user)).then(()=>refreshApiData(false)).then(()=>render()).catch(e=>{apiToken='';localStorage.removeItem('hardware_pos_api_token');setApiUser(null);console.warn('API session unavailable:',e.message)})}
document.getElementById('shopBrand').textContent=db.shop.name;render();
</script></body></html>
