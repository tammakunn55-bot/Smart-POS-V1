*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 14px;font-weight:650}button:disabled{opacity:.45;cursor:not-allowed}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:var(--green);color:white;padding:22px 15px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;gap:11px;align-items:center;padding:0 9px}.brand-icon{width:43px;height:43px;border-radius:14px;background:var(--lime);color:var(--green);display:grid;place-items:center;font-size:23px}.brand h1{font-size:16px;margin:0}.brand small{display:block;color:#b6c9bf;font-size:11px;margin-top:3px}.nav{display:grid;gap:6px}.nav button{display:flex;align-items:center;gap:12px;text-align:left;background:transparent;color:#d5e2da;padding:12px 13px}.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}.nav .ico{width:22px;text-align:center}.sidefoot{margin-top:auto;padding:14px 10px;border-top:1px solid #ffffff24;color:#b6c9bf;font-size:12px;line-height:1.6}.main{min-width:0}.topbar{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:14px}.eyebrow{color:var(--muted);font-size:12px}.topbar h2{font-size:20px;margin:3px 0 0}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:#e7f0d3;display:grid;place-items:center;color:var(--green);font-weight:800}.content{padding:26px 30px;max-width:1600px;margin:auto}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}.pagehead h3{font-size:23px;margin:0}.pagehead p{color:var(--muted);margin:5px 0 0;font-size:13px}.btn-primary{background:var(--green);color:white}.btn-soft{background:#eaf1e9;color:var(--green)}.btn-outline{background:white;border:1px solid ns:repeat(3,minmax(0,1fr));gap:12px}.product-card{background:white;border:1px solid var(--line);border-radius:15px;padding:14px;text-align:left;min-width:0;transition:.15s}.product-card:hover{border-color:#8aa794;transform:translateY(-1px)}.product-emoji{height:80px;border-radius:11px;background:#f1f4ef;display:grid;place-items:center;font-size:34px;margin-bottom:12px}.product-card strong{display:block;font-size:13px;line-height:1.4;min-height:37px}.product-card small{display:block;color:var(--muted);margin:5px 0 9px}.product-card .price{font-weight:800;color:var(--green);font-size:16px}.cart-panel{position:sticky;top:15px}.cart-list{display:grid;gap:11px;max-height:300px;overflow:auto}.cart-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding-bottom:11px;border-bottom:1px solid var(--line)}.cart-row strong{font-size:12px}.cart-row small{display:block;color:var(--muted);margin-top:4px}.qty{display:flex;align-items:center;gap:8px;margin-top:8px}.qty button{padding:2px 8px;background:#edf2eb;border-radius:7px}.cart-sum{display:flex;justify-content:space-between;margin:11px 0;color:var(--muted);font-size:13px}.cart-sum.total{border-top:1px solid var(--line);padding-top:14px;color:var(--text);font-size:16px;font-weight:800}.checkout{width:100%;padding:14px;margin-top:8px}.empty{padding:35px 10px;text-align:center;color:var(--muted);font-size:13px}.empty span{font-size:30px;display:block;margin-bottom:8px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-item label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.form-item.full{grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;background:#101c1680;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-backdrop.show{display:flex}.modal{background:white;border-radius:18px;padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #0003}.modal h3{margin:0 0 18px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:22px;bottom:22px;background:#173f35;color:white;padding:13px 17px;border-radius:12px;box-shadow:var(--shadow);display:none;z-index:40}.toast.show{display:block}.receipt{font-family:monospace;white-space:pre-wrap;background:#f7f8f6;padding:18px;border-radius:10px;font-size:13px}.mobile-menu{display:none}.chart-bars{height:160px;display:flex;align-items:end;gap:12px;padding-top:15px}.bar-wrap{flex:1;text-align:center;font-size:11px;color:var(--muted)}.bar{background:#a7c4a5;border-radius:7px 7px 0 0;min-height:5px;margin-bottom:7px}.bar.today{background:var(--green2)}.settings-note{font-size:13px;line-height:1.7;color:var(--muted)}

<body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-icon">⚒</div><div><h1 id="shopBrand">ช่างครบ ฮาร์ดแวร์</h1><small>SMART HARDWARE POS · v1.8.0</small></div></div>
<nav class="nav" id="nav">
<button class="active" data-page="dashboard"><span class="ico">▦</span>ภาพรวมร้าน</button>
<button data-page="pos"><span class="ico">🛒</span>ขายหน้าร้าน</button>
<button data-page="products"><span class="ico">▤</span>สินค้าและราคา</button>
<button data-page="inventory"><span class="ico">▥</span>คลังสินค้า</button>

<button data-page="sales"><span class="ico">▧</span>ประวัติการขาย</button>
<button data-page="returns"><span class="ico">↩</span>คืนสินค้า / คืนเงิน</button>
<button data-page="shifts"><span class="ico">💵</span>กะเงินสด / ปิดยอด</button>

<button data-page="users"><span class="ico">♙</span>ผู้ใช้และสิทธิ์</button></nav>
<div class="sidefoot">โหมดตัวอย่างบนอุปกรณ์นี้<br>ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้</div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-menu" id="mobileMenu">☰</button><div><div class="eyebrow">ระบบจัดการร้านค้า / <span id="crumb">ภาพรวมร้าน</span></div><h2 id="topTitle">ภาพรวมร้าน</h2></div></div><div class="user"><div class="avatar" id="userAvatar">ผ</div><div class="usertext"><strong id="userDisplayName" style="font-size:13px">โหมดตัวอย่าง</strong><div class="eyebrow" id="userRoleLabel">ยังไม่ได้เข้าสู่ระบบ API</div></div></div></header>
<div class="content" id="content"></div></main></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const STORE='hardware_pos_demo_v1';
const seed={shop:{name:'ช่างครบ ฮาร์ดแวร์',phone:'',address:'',footer:'ขอบคุณที่ใช้บริการ'},products:[
{id:1,sku:'TOOL-001',name:'ค้อนหงอนด้ามไฟเบอร์ 16 oz',category:'เครื่องมือช่าง',unit:'อัน',cost:95,price:159,stock:24,min:5,emoji:'🔨'},
{id:2,sku:'TOOL-002',name:'ไขควงแฉก PH2 6 นิ้ว',category:'เครื่องมือช่าง',unit:'อัน',cost:22,price:39,stock:31,min:8,emoji:'🪛'},
{id:3,sku:'ELEC-001',name:'เทปพันสายไฟ 10 เมตร',category:'อุปกรณ์ไฟฟ้า',unit:'ม้วน',cost:12,price:25,stock:42,min:10,emoji:'🧰'},
{id:4,sku:'PLUM-001',name:'เทปพันเกลียว 10 เมตร',category:'ประปา',unit:'ม้วน',cost:6,price:15,stock:7,min:10,emoji:'🧵'},
{id:5,sku:'FAST-001',name:'สกรูเกลียวปล่อย 1 นิ้ว',category:'น็อตและสกรู',unit:'กล่อง',cost:35,price:55,stock:16,min:4,emoji:'🔩'},
{id:6,sku:'PAINT-001',name:'แปรงทาสี 2 นิ้ว',category:'สีและอุปกรณ์',unit:'อัน',cost:18,price:35,stock:19,min:5,emoji:'🖌️'},
{id:7,sku:'ELEC-002',name:'ปลั๊กไฟ 3 ช่อง มีกราวด์',category:'อุปกรณ์ไฟฟ้า',unit:'อัน',cost:95,price:149,stock:8,min:5,emoji:'🔌'},
{id:8,sku:'PLUM-002',name:'ข้องอ PVC 1/2 นิ้ว',category:'ประปา',unit:'ตัว',cost:3,price:8,stock:90,min:20,emoji:'〰️'},
{id:9,sku:'BUILD-001',name:'ปูนซีเมนต์ 50 กก.',category:'วัสดุก่อสร้าง',unit:'ถุง',cost:118,price:145,stock:14,min:5,emoji:'🧱'},
{id:10,sku:'TOOL-003',name:'คีมปากจิ้งจก 8 นิ้ว',category:'เครื่องมือช่าง',unit:'อัน',cost:65,price:99,stock:12,min:4,emoji:'🔧'},
{id:11,sku:'PAINT-002',name:'ลูกกลิ้งทาสี 4 นิ้ว',category:'สีและอุปกรณ์',unit:'อัน',cost:24,price:45,stock:4,min:5,emoji:'🎨'},
{id:12,sku:'FAST-002',name:'ตะปูคอนกรีต 1.5 นิ้ว',category:'น็อตและสกรู',unit:'กิโลกรัม',cost:32,price:48,stock:3,min:5,emoji:'📌'}],customers:[{id:1,name:'ลูกค้าทั่วไป',phone:'',credit:0}],sales:[],cart:[]};
let db=load(),page='dashboard',categoryFilter='ทั้งหมด',searchTerm='',pendingProductImport=[],pendingProductImportErrors=[],purchaseOrders=[],purchaseSuppliers=[],purchaseReceipts=[],orderLineCount=1;
function load(){try{return JSON.parse(localStorage.getItem(STORE))||structuredClone(seed)}catch(e){return JSON.parse(JSON.stringify(seed))}}
function save(){localStorage.setItem(STORE,JSON.stringify(db))}
function money(n){return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
const titles={dashboard:'ภาพรวมร้าน',pos:'ขายหน้าร้าน',products:'สินค้าและราคา',inventory:'คลังสินค้า',inventoryCounts:'ตรวจนับสต็อก',sales:'ประวัติการขาย',returns:'คืนสินค้า / คืนเงิน',customers:'ลูกค้าและเครดิต',reports:'รายงาน',settings:'ตั้งค่าร้าน',purchasing:'จัดซื้อ / รับสินค้า',shifts:'กะเงินสด / ปิดยอด',users:'ผู้ใช้และสิทธิ์'};
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('topTitle').textContent=titles[p];document.getElementById('crumb').textContent=titles[p];document.getElementById('sidebar').classList.remove('open');render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
document.getElementById('mobileMenu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
function render(){let c=document.getElementById('content');({dashboard:dashboardPage,pos:posPage,products:productsPage,inventory:inventoryPage,inventoryCounts:inventoryCountsPage,sales:salesPage,returns:returnsPage,customers:customersPage,reports:reportsPage,settings:settingsPage,purchasing:purchasingPage,shifts:shiftsPage,users:usersPage}[page]||dashboardPage)(c)}
function dashboardPage(c){let today=new Date().toLocaleDateString('en-CA');let ss=db.sales.filter(s=>s.date.slice(0,10)===today);let total=ss.reduce((a,s)=>a+s.total,0),count=ss.length,low=db.products.filter(p=>p.stock<=p.min);
let recent=[...db.sales].reverse().slice(0,5);let week=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let key=d.toLocaleDateString('en-CA');return{label:d.toLocaleDateString('th-TH',{weekday:'short'}),sum:db.sales.filter(s=>s.date.slice(0,10)===key).reduce((a,x)=>a+x.total,0)}});
let max=Math.max(1,...week.map(x=>x.sum));
c.innerHTML=`<div class="pagehead"><div><h3>สวัสดีครับ 👋</h3><p>สรุปภาพรวมการดำเนินงานของร้านคุณวันนี้</p></div><button class="btn-primary" onclick="go('pos')">＋ เปิดบิลขาย</button></div>
<div class="stats"><div class="stat"><div class="stat-top">ยอดขายวันนี้ <span class="stat-icon">฿</span></div><strong>฿${money(total)}</strong><small>จาก ${count} บิล</small></div><div class="stat"><div class="stat-top">จำนวนสินค้า <span class="stat-icon">▤</span></div><strong>${db.products.length}</strong><small>รายการสินค้าในระบบ</small></div><div class="stat"><div class="stat-top">สินค้าใกล้หมด <span class="stat-icon">⚠️</span></div><strong>${low.length}</strong><small>รายการที่ควรเติมสต็อก</small></div><div class="stat"><div class="stat-top">ลูกค้าในระบบ <span class="stat-icon">♙</span></div><strong>${db.customers.length}</strong><small>รายชื่อลูกค้า</small></div></div>
<div class="two-col"><section class="panel"><div class="panel-title"><h4>ยอดขาย 7 วันล่าสุด</h4><span class="muted" style="font-size:12px">บาท</span></div><div class="chart-bars">${week.map((x,i)=>`<div class="bar-wrap"><div class="bar ${i===6?'today':''}" style="height:${Math.max(5,x.sum/max*120)}px" title="${money(x.sum)}"></div>${x.label}</div>`).join('')}</div></section>
<section class="panel"><div class="panel-title"><h4>สินค้าใกล้หมด</h4><button class="btn-soft" onclick="go('inventory')">ดูคลังสินค้า</button></div>${low.length?low.slice(0,5).map(p=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><div class="product-name"><div class="product-thumb">${p.emoji}</div><div><strong style="font-size:12px">${esc(p.name)}</strong><div class="muted" style="font-size:11px">${esc(p.sku)}</div></div></div><span class="pill ${p.stock===0?'bad':'warn'}">เหลือ ${p.stock} ${esc(p.unit)}</span></div>`).join(''):'<div class="empty">สต็อกสินค้าอยู่ในระดับปกติ</div>'}</section>
<section class="panel" style="grid-column:1/-1"><div class="panel-title"><h4>รายการขายล่าสุด</h4><button class="btn-outline" onclick="go('sales')">ดูประวัติทั้งหมด →</button></div>${salesTable(recent)}</section></div>`}
function salesTable(rows){if(!rows.length)return '<div class="empty"><span>🧾</span>ยังไม่มีประวัติการขาย</div>';return `<div class="table-wrap"><table><thead><tr><th>เลขที่บิล</th><th>วันที่ / เวลา</th><th>รายการ</th><th>ช่องทางชำระ</th><th style="text-align:right">ยอดรวม</th></tr></thead><tbody>${rows.map(s=>`<tr><td><strong>${esc(s.no)}</strong></td><td>${new Date(s.date).toLocaleString('th-TH')}</td><td>${s.items.length} รายการ</td><td>${esc(s.payment)}</td><td style="text-align:right;font-weight:750">฿${money(s.total)}</td></tr>`).join('')}</tbody></table></div>`}
function posPage(c){let cats=['ทั้งหมด',...new Set(db.products.map(p=>p.category))];let products=db.products.filter(p=>(categoryFilter==='ทั้งหมด'||p.category===categoryFilter)&&(`${p.name} ${p.sku} ${p.category}`).toLowerCase().includes(searchTerm.toLowerCase()));
c.innerHTML=`<div class="pagehead"><div><h3>ขายหน้าร้าน</h3><p>เลือกสินค้าเพื่อเพิ่มลงตะกร้า แล้วชำระเงินเพื่อออกบิล</p></div><span class="pill">POS พร้อมขาย</span></div><div class="pos-layout"><section><div class="toolbar"><input class="field search" id="posSearch" placeholder="ค้นหาชื่อสินค้า / SKU..." value="${esc(searchTerm)}"><input class="field search" id="barcodeScan" placeholder="สแกนบาร์โค้ดแล้วกด Enter" style="max-width:240px"><select class="field select" id="catFilter">${cats.map(x=>`<option ${x===categoryFilter?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="product-grid">${products.map(p=>`<button class="product-card" onclick="addCart(${JSON.stringify(p.id)})" ${p.stock<=0?'disabled':''}><div class="product-emoji">${p.emoji}</div><strong>${esc(p.name)}</strong><small>${esc(p.sku)} · คงเหลือ ${p.stock} ${esc(p.unit)}</small><span class="price">฿${money(p.price)}</span></button>`).join('')||'<div class="empty">ไม่พบสินค้าที่ค้นหา</div>'}</div></section><aside class="panel cart-panel"><div class="panel-title"><h4>🛒 รายการในบิล</h4><button class="btn-outline" onclick="clearCart()">ล้าง</button></div><div class="cart-list">${db.cart.length?db.cart.map(it=>{let p=cartProduct(it),price=cartUnitPrice(it,p),unit=cartUnitName(it,p);return p?`<div class="cart-row"><div><strong>${esc(p.name)}</strong><small>฿${money(price)} / ${esc(unit)}${it.unitId?' · '+cartFactor(it)+' '+esc(p.unit)+' ต่อ '+esc(unit):''}</small><div class="qty"><button onclick="changeQty('${esc(cartKey(it))}',-1)">−</button><span>${it.qty}</span><button onclick="changeQty('${esc(cartKey(it))}',1)">+</button></div></div><strong>฿${money(price*it.qty)}</strong></div>`:''}).join(''):'<div class="empty"><span>🛒</span>ยังไม่มีสินค้าในบิล</div>'}</div><div style="margin-top:16px"><div class="cart-sum"><span>จำนวนสินค้า</span><strong>${db.cart.reduce((a,x)=>a+x.qty,0)} ชิ้น</strong></div><div class="cart-sum"><span>ยอดรวม</span><strong>฿${money(cartTotal())}</strong></div><div class="cart-sum"><label for="discount">ส่วนลด (บาท)</label><input class="field" style="width:100px;padding:7px" id="discount" type="number" min="0" max="${cartTotal()}" value="0" oninput="updateDiscount(this.value)"></div><div class="cart-sum total"><span>ยอดสุทธิ</span><strong>฿${money(Math.max(0,cartTotal()-discountValue))}</strong></div><button class="btn-primary checkout" onclick="checkout()" ${db.cart.length?'':'disabled'}>ชำระเงิน · ฿${money(Math.max(0,cartTotal()-discountValue))}</button></div></aside></div>`;
document.getElementById('posSearch').oninput=e=>{searchTerm=e.target.value;let pos=document.activeElement.selectionStart;posPage(c);let input=document.getElementById('posSearch');input.focus();input.setSelectionRange(pos,pos)};
document.getElementById('catFilter').onchange=e=>{categoryFilter=e.target.value;posPage(c)};const scan=document.getElementById('barcodeScan');scan.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();scanBarcode(scan.value);scan.value=''}})}
let discountValue=0;function cartKey(it){return String(it.id)+':'+String(it.unitId||'base')}function cartProduct(it){return db.products.find(x=>String(x.id)===String(it.id))}function cartUnitName(it,p){return it.unitName||p?.unit||'ชิ้น'}function cartUnitPrice(it,p){return Number(it.unitPrice??p?.price??0)}function cartFactor(it){return Number(it.conversionFactor||1)}function cartTotal(){return db.cart.reduce((a,it)=>{let p=cartProduct(it);return a+(p?cartUnitPrice(it,p)*it.qty:0)},0)}
async function scanBarcode(raw){const code=String(raw||'').trim();if(!code)return;if(!apiToken){const p=db.products.find(x=>String(x.barcode||'')===code||String(x.sku||'')===code);if(p){addCart(p.id);return}return toast('โหมดตัวอย่างรองรับเฉพาะบาร์โค้ดในข้อมูลที่โหลดไว้')}try{const r=await apiRequest('/api/v1/products/barcode/'+encodeURIComponent(code));const u=r.item,p=db.products.find(x=>String(x.id)===String(u.variant_id));if(!p)await refreshApiData(false);const base=db.products.find(x=>String(x.id)===String(u.variant_id));if(!base)throw new Error('ไม่พบข้อมูลสินค้าพื้นฐาน');if(Number(u.stock)<Number(u.conversion_factor))throw new Error('สต็อกไม่พอสำหรับหน่วยขายนี้');const unitId=u.unit_id||null;const existing=db.cart.find(x=>String(x.id)===String(u.variant_id)&&String(x.unitId||'')===String(unitId||''));if(existing)existing.qty+=1;else db.cart.push({id:u.variant_id,unitId,qty:1,unitName:u.unit_name,unitPrice:Number(u.sale_price),conversionFactor:Number(u.conversion_factor)});save();render();toast('เพิ่มสินค้า '+u.name+' ('+u.unit_name+') แล้ว')}catch(e){toast('สแกนไม่สำเร็จ: '+e.message)}}function updateDiscount(v){discountValue=Math.min(cartTotal(),Math.max(0,Number(v)||0));let b=document.querySelector('.checkout');if(b)b.textContent=`ชำระเงิน · ฿${money(cartTotal()-discountValue)}`}
function addCart(id){let p=db.products.find(x=>String(x.id)===String(id));if(!p||p.stock<=0)return toast('สินค้าหมด');let it=db.cart.find(x=>String(x.id)===String(id)&&!x.unitId);if(it){if((it.qty+1)*cartFactor(it)>p.stock)return toast('จำนวนเกินสต็อก');it.qty++}else db.cart.push({id,qty:1});save();render()}
function changeQty(key,d){let it=db.cart.find(x=>cartKey(x)===String(key));if(!it)return;let p=cartProduct(it);it.qty+=d;if(it.qty<=0)db.cart=db.cart.filter(x=>cartKey(x)!==String(key));if(it&&p&&it.qty*cartFactor(it)>p.stock){it.qty=Math.floor(p.stock/cartFactor(it)*1000)/1000;toast('จำนวนเกินสต็อก')}save();render()}
function clearCart(){db.cart=[];discountValue=0;save();render()}
function checkout(){if(!db.cart.length)return;let total=Math.max(0,cartTotal()-discountValue);openModal(`<h3>ชำระเงิน</h3><p class="muted">ตรวจสอบยอดก่อนยืนยันการขาย</p><div class="panel" style="padding:16px;margin:15px 0"><div class="cart-sum"><span>ยอดก่อนลด</span><strong>฿${money(cartTotal())}</strong></div><div class="cart-sum"><span>ส่วนลด</span><strong>฿${money(discountValue)}</strong></div><div class="cart-sum total"><span>ยอดสุทธิ</span><strong>฿${money(total)}</strong></div></div><div class="form-item"><label>วิธีชำระเงิน</label><select class="field" id="payMethod"><option>เงินสด</option><option>โอนเงิน</option><option>บัตรเครดิต</option></select></div><div class="form-item" style="margin-top:12px"><label>รับเงินมา (บาท)</label><input class="field" id="payReceived" type="number" min="${total}" value="${total}"></div><div id="changeDue" class="muted" style="margin-top:10px">เงินทอน: ฿0.00</div><div class="modal-actions"><button class="btn-outline" onclick="closeModal()">ยกเลิก</button><button class="btn-primary" onclick="finishSale()">ยืนยันขาย</button></div>`);
let r=document.getElementById('payReceived');r.oninput=()=>{document.getElementById('changeDue').textContent='เงินทอน: ฿'+money(Math.max(0,(Number(r.value)||0)-total))}}
async function finishSale(){let total=Math.max(0,cartTotal()-discountValue),received=Number(document.getElementById('payReceived').value),method=document.getElementById('payMethod').value;if(received<total)return toast('จำนวนเงินรับไม่ครบ');for(let it of db.cart){let p=db.products.find(x=>String(x.id)===String(it.id));if(!p||p.stock<it.qty*cartFactor(it))return toast('สต็อกเปลี่ยนแปลง กรุณาตรวจสอบใหม่')}
if(apiToken){try{const payload={items:db.cart.map(it=>({variant_id:it.id,unit_id:it.unitId||undefined,quantity:it.qty})),bill_discount:discountValue,payments:[{method:({'เงินสด':'cash','โอนเงิน':'transfer','บัตรเครดิต':'other'}[method]||'cash'),amount:total}],note:null};const result=await apiRequest('/api/v1/sales',{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()},body:JSON.stringify(payload)});const bill=result.bill||{};let sale={no:bill.bill_no||'INV-'+Date.now(),date:bill.created_at||new Date().toISOString(),items:db.cart.map(it=>{let p=db.products.find(x=>String(x.id)===String(it.id));return{name:p.name,sku:p.sku,unit:cartUnitName(it,p),price:cartUnitPrice(it,p),qty:it.qty}}),subtotal:cartTotal(),discount:discountValue,total,payment:method,received,change:received-total};db.cart=[];discountValue=0;await refreshApiData(false);closeModal();render();toast('บันทึกการขายลงฐานข้อมูลแล้ว');setTimeout(()=>showReceipt(sale),250);return}catch(e){toast('บันทึกไม่สำเร็จ: '+e.message);return}}
let sale={no:'INV-'+Date.now().toString().slice(-8),date:new Date().toISOString(),items:db.cart.map(it=>{let p=db.products.find(x=>String(x.id)===String(it.id));return{name:p.name,sku:p.sku,unit:cartUnitName(it,p),price:cartUnitPrice(it,p),qty:it.qty}}),subtotal:cartTotal(),discount:discountValue,total,payment:method,received,change:received-total};db.cart.forEach(it=>{let p=db.products.find(x=>String(x.id)===String(it.id));p.stock-=it.qty});db.sales.push(sale);db.cart=[];discountValue=0;save();closeModal();render();toast('บันทึกการขายแล้ว');setTimeout(()=>showReceipt(sale),250)}
function showReceipt(s){let lines=[db.shop.name,'ใบเสร็จรับเงิน',`เลขที่: ${s.no}`,new Date(s.date).toLocaleString('th-TH'),'--------------------------------'];s.items.forEach(it=>lines.push(`${it.name}`,`${it.qty} ${it.unit} x ${money(it.price)} = ${money(it.qty*it.price)}`));lines.push('--------------------------------',`รวม ${money(s.subtotal)}`,`ส่วนลด ${money(s.discount)}`,`ยอดสุทธิ ${money(s.total)}`,`ชำระ: ${s.payment}`,`รับเงิน ${money(s.received)}`,`เงินทอน ${money(s.change)}`,'',db.shop.footer||'ขอบคุณที่ใช้บริการ');openModal(`<h3>ขายสำเร็จ ✓</h3><div class="receipt">${esc(lines.join('\n'))}</div><div class="modal-actions"><button class="btn-outline" onclick="closeModal()">ปิด</button><button class="btn-primary" onclick="window.print()">พิมพ์ใบเสร็จ</button></div>`)}
function productsPage(c){c.innerHTML=`<div class="pagehead"><div><h3>สินค้าและราคา</h3><p>จัดการ SKU ราคาขาย ต้นทุน หน่วย และหมวดหมู่</p></div><div class="toolbar"><button class="btn-outline" onclick="downloadProductTemplate()">⇩ ไฟล์ตัวอย่างนำเข้า</button><label class="btn-outline" style="display:inline-flex;align-items:center;cursor:pointer">⇧ นำเข้าสินค้า CSV<input type="file" accept=".csv,text/csv" style="display:none" onchange="importProductsFile(event)"></label><button class="btn-outline" onclick="exportProducts()">⇩ ส่งออกสินค้า CSV</button><button class="btn-primary" onclick="productModal()">＋ เพิ่มสินค้า</button></div></div><div class="panel"><p class="settings-note">นำเข้าสินค้าใหม่ได้ครั้งละไม่เกิน 500 รายการ · ใช้ไฟล์ CSV ที่บันทึกจาก Excel · SKU/บาร์โค้ดซ้ำจะไม่ถูกนำเข้า · ไม่เขียนทับสินค้าเดิมหรือสต็อกเดิม</p><div class="toolbar"><input class="field search" id="productSearch" placeholder="ค้นหาชื่อ / SKU / หมวดหมู่..."><select class="field select" id="productCategory"><option>ทุกหมวดหมู่</option>${[...new Set(db.products.map(p=>p.category))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div id="productsTable">${productTable(db.products)}</div></div>`;document.getElementById('productSearch').oninput=filterProducts;document.getElementById('productCategory').onchange=filterProducts}
function productTable(rows){return rows.length?`<div class="table-wrap"><table><thead><tr><th>สินค้า</th><th>SKU</th><th>หมวดหมู่</th><th>ต้นทุน</th><th>ราคาขาย</th><th>คงเหลือ</th><th>บาร์โค้ด</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr><td><div class="product-name"><div class="product-thumb">${p.emoji}</div><div><strong>${esc(p.name)}</strong><div class="muted" style="font-size:11px">${esc(p.unit)}</div></div></div></td><td>${esc(p.sku)}</td><td>${esc(p.category)}</td><td>฿${money(p.cost)}</td><td><strong>฿${money(p.price)}</strong></td><td><span class="pill ${p.stock<=p.min?'warn':''}">${p.stock}</span></td><td>${esc(p.barcode||'-')}</td><td><div class="toolbar"><button class="btn-outline" onclick="productModal(${JSON.stringify(p.id)})">แก้ไข</button>${apiToken?`<button class="btn-soft" onclick="manageSellUnits('${esc(p.id)}')">หน่วยขาย</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ไม่พบสินค้า</div>'}
async function manageSellUnits(variantId){if(!apiToken)return toast('กรุณาเชื่อมต่อ API ก่อน');try{const r=await apiRequest(`/api/v1/products/${variantId}/units`);const base=r.base_unit,units=r.units||[];openModal(`<h3>หน่วยขายหลายระดับ</h3><p class="muted">สต็อกเก็บเป็นหน่วยฐาน (${esc(base.unit_name)}) เสมอ ตัวคูณคือจำนวนหน่วยฐานที่ใช้ต่อหนึ่งหน่วยขาย</p><div class="table-wrap"><table><thead><tr><th>หน่วยขาย</th><th>บาร์โค้ด</th><th>ตัวคูณ</th><th>ราคาขาย</th><th>สถานะ</th></tr></thead><tbody><tr><td>${esc(base.unit_name)} (ฐาน)</td><td>${esc(base.barcode||'-')}</td><td>1</td><td>฿${money(base.sale_price)}</td><td>ใช้งาน</td></tr>${units.map(u=>`<tr><td>${esc(u.unit_name)}</td><td>${esc(u.barcode||'-')}</td><td>${u.conversion_factor}</td><td>฿${money(u.sale_price)}</td><td>${u.is_active?'ใช้งาน':'ปิด'}</td></tr>`).join('')}</tbody></table></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><h4>เพิ่มหน่วยขาย</h4><div class="form-grid"><div class="form-item"><label>ชื่อหน่วย (เช่น แพ็ก / กล่อง / ลัง)</label><input class="field" id="sellUnitName" placeholder="ลัง"></div><div class="form-item"><label>บาร์โค้ดหน่วยนี้ (ใช้สแกนขาย)</label><input class="field" id="sellUnitBarcode" placeholder="สแกนหรือกรอกบาร์โค้ด"></div><div class="form-item"><label>จำนวนหน่วยฐานต่อ 1 หน่วยขาย</label><input class="field" id="sellUnitFactor" type="number" min="1.001" step="0.001" placeholder="เช่น 12"></div><div class="form-item"><label>ราคาขายต่อหน่วย (บาท)</label><input class="field" id="sellUnitPrice" type="number" min="0" step="0.01" placeholder="เช่น 120"></div></div><div class="modal-actions"><button class="btn-outline" onclick="closeModal()">ปิด</button><button class="btn-primary" onclick="saveSellUnit('${esc(variantId)}')">บันทึกหน่วยขาย</button></div>`)}catch(e){toast('โหลดหน่วยขายไม่สำเร็จ: '+e.message)}}
async function saveSellUnit(variantId){const body={unit_name:document.getElementById('sellUnitName').value,barcode:document.getElementById('sellUnitBarcode').value,conversion_factor:Number(document.getElementById('sellUnitFactor').value),sale_price:Number(document.getElementById('sellUnitPrice').value)};if(!String(body.barcode||'').trim())return toast('กรุณาระบุบาร์โค้ดของหน่วยขาย เพื่อให้สแกนขายจากหน้า POS ได้');try{await apiRequest(`/api/v1/products/${variantId}/units`,{method:'POST',body:JSON.stringify(body)});toast('เพิ่มหน่วยขายแล้ว');await manageSellUnits(variantId)}catch(e){toast('บันทึกหน่วยขายไม่สำเร็จ: '+e.message)}}
function exportProducts(){const rows=[['SKU','ชื่อสินค้า','หมวดหมู่','บาร์โค้ด','หน่วย','ต้นทุน','ราคาขาย','คงเหลือ','จุดแจ้งเตือน'],...db.products.map(p=>[p.sku,p.name,p.category,p.barcode||'',p.unit,p.cost,p.price,p.stock,p.min])];downloadCSV('hardware-pos-products.csv',rows);toast('ส่งออกสินค้า CSV แล้ว')}
function downloadProductTemplate(){downloadCSV('hardware-pos-product-import-template.csv',[['SKU','Name','Category','Barcode','Unit','CostPrice','SalePrice','OpeningStock','LowStockThreshold'],['WIRE-001','สายไฟ THW 1.5 ตร.มม.','อุปกรณ์ไฟฟ้า','8850000000012','เมตร',8.5,12,0,10]]);toast('ดาวน์โหลดไฟล์ตัวอย่างแล้ว')}
function parseCsvRows(text){text=String(text||'').replace(/^\uFEFF/,'');const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){field+='"';i++}else if(ch==='"')quoted=false;else field+=ch;}else if(ch==='"')quoted=true;else if(ch===','){row.push(field);field=''}else if(ch==='\n'){row.push(field);rows.push(row);row=[];field=''}else if(ch!=='\r')field+=ch;}if(field.length||row.length){row.push(field);rows.push(row)}return rows.filter(r=>r.some(v=>String(v).trim()!==''))}
function importHeaderKey(value){const s=String(value||'').trim().toLowerCase().replace(/[ _-]/g,'');const aliases={sku:'sku',รหัสสินค้า:'sku',รหัส:'sku',name:'name',productname:'name',ชื่อสินค้า:'name',ชื่อ:'name',category:'category_name',categoryname:'category_name',หมวดหมู่:'category_name',barcode:'barcode',บาร์โค้ด:'barcode',unit:'unit_name',unitname:'unit_name',หน่วย:'unit_name',cost:'cost_price',costprice:'cost_price',ต้นทุน:'cost_price',ราคาทุน:'cost_price',price:'sale_price',saleprice:'sale_price',ราคาขาย:'sale_price',openingstock:'opening_stock',stock:'opening_stock',สต็อกเริ่มต้น:'opening_stock',จำนวนเริ่มต้น:'opening_stock',lowstockthreshold:'low_stock_threshold',min:'low_stock_threshold',จุดแจ้งเตือน:'low_stock_threshold'};return aliases[s]||s}
async function importProductsFile(event){const file=event.target.files?.[0];event.target.value='';if(!file)return;if(file.size>2*1024*1024)return toast('ไฟล์ใหญ่เกิน 2 MB');try{const text=await file.text(),matrix=parseCsvRows(text);if(matrix.length<2)return toast('ไม่พบรายการสินค้าในไฟล์');const headers=matrix[0].map(importHeaderKey);if(!headers.includes('sku')||!headers.includes('name'))return toast('ต้องมีคอลัมน์ SKU และ Name (ชื่อสินค้า)');if(matrix.length-1>500)return toast('นำเข้าได้ไม่เกิน 500 รายการต่อครั้ง');pendingProductImport=matrix.slice(1).map((cells,i)=>{const o={row_number:i+2};headers.forEach((h,j)=>{if(h)o[h]=String(cells[j]??'').trim()});for(const k of ['cost_price','sale_price','opening_stock','low_stock_threshold'])o[k]=o[k]===''||o[k]===undefined?0:Number(o[k]);o.category_name=o.category_name||'';o.barcode=o.barcode||'';o.unit_name=o.unit_name||'ชิ้น';return o});let errors=[],seenSku=new Set(),seenBarcode=new Set();for(const r of pendingProductImport){const e=[];if(!r.sku)e.push('ไม่มี SKU');if(!r.name)e.push('ไม่มีชื่อสินค้า');for(const k of ['cost_price','sale_price','opening_stock','low_stock_threshold'])if(!Number.isFinite(r[k])||r[k]<0)e.push('ค่า '+k+' ไม่ถูกต้อง');const sk=String(r.sku).toLowerCase();if(sk&&seenSku.has(sk))e.push('SKU ซ้ำในไฟล์');if(r.barcode&&seenBarcode.has(r.barcode))e.push('บาร์โค้ดซ้ำในไฟล์');if(sk)seenSku.add(sk);if(r.barcode)seenBarcode.add(r.barcode);if(!apiToken&&db.products.some(p=>String(p.sku).toLowerCase()===sk))e.push('SKU มีอยู่แล้ว');if(!apiToken&&r.barcode&&db.products.some(p=>p.barcode===r.barcode))e.push('บาร์โค้ดมีอยู่แล้ว');if(e.length)errors.push({row_number:r.row_number,sku:r.sku,errors:e})}if(apiToken){const preview=await apiRequest('/api/v1/products/import/preview',{method:'POST',body:JSON.stringify({rows:pendingProductImport})});const merged=new Map(errors.map(e=>[e.row_number,{...e,errors:[...e.errors]}]));for(const e of (preview.errors||[])){if(!merged.has(e.row_number))merged.set(e.row_number,{...e,errors:[...e.errors]});else merged.get(e.row_number).errors=[...new Set([...merged.get(e.row_number).errors,...e.errors])]}errors=[...merged.values()]}pendingProductImportErrors=errors;const badRows=new Set(errors.map(e=>e.row_number));const valid=pendingProductImport.length-badRows.size;openModal(`<h3>ตรวจสอบก่อนนำเข้าสินค้า</h3><p class="settings-note">ไฟล์: ${esc(file.name)} · ทั้งหมด ${pendingProductImport.length} รายการ</p><div class="stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><small>นำเข้าได้</small><strong>${valid}</strong></div><div class="stat"><small>ต้องแก้ไข</small><strong>${badRows.size}</strong></div></div><p class="settings-note">โหมดนำเข้าเป็นแบบเพิ่มสินค้าใหม่เท่านั้น ไม่แก้ไขสินค้าที่มีอยู่และไม่ปรับสต็อกเดิม หากมีแถวผิดพลาด ให้นำเข้าเฉพาะรายการที่ผ่านการตรวจสอบ</p>${errors.length?`<div class="table-wrap"><table><thead><tr><th>แถว</th><th>SKU</th><th>ข้อผิดพลาด</th></tr></thead><tbody>${errors.slice(0,12).map(e=>`<tr><td>${e.row_number}</td><td>${esc(e.sku)}</td><td>${esc(e.errors.join(', '))}</td></tr>`).join('')}</tbody></table></div>${errors.length>12?`<p class="settings-note">แสดง 12 รายการแรกจาก ${errors.length} รายการที่ผิดพลาด</p>`:''}`:'<p class="pill">ไม่พบข้อผิดพลาด</p>'}<div class="modal-actions"><button class="btn-outline" onclick="closeModal()">ยกเลิก</button><button class="btn-primary" ${valid===0?'disabled':''} onclick="confirmProductImport()">นำเข้า ${valid} รายการ</button></div>`)}catch(e){toast('อ่าน/ตรวจสอบไฟล์ไม่สำเร็จ: '+e.message)}}
async function confirmProductImport(){const rows=pendingProductImport;const blocked=new Set(pendingProductImportErrors.map(e=>e.row_number));const valid=rows.filter(r=>!blocked.has(r.row_number)&&r.sku&&r.name&&!['cost_price','sale_price','opening_stock','low_stock_threshold'].some(k=>!Number.isFinite(r[k])||r[k]<0));if(!valid.length)return toast('ไม่มีรายการที่นำเข้าได้');if(apiToken){try{const result=await apiRequest('/api/v1/products/import',{method:'POST',body:JSON.stringify({rows:valid})});await refreshApiData(false);closeModal();render();toast('นำเข้าสินค้าใหม่ '+result.imported+' รายการแล้ว')}catch(e){toast('นำเข้าไม่สำเร็จ: '+e.message)}return}const seen=new Set(db.products.map(p=>String(p.sku).toLowerCase()));const barcodes=new Set(db.products.map(p=>p.barcode).filter(Boolean));const add=[];for(const r of valid){const sku=String(r.sku).toLowerCase();if(seen.has(sku)||(r.barcode&&barcodes.has(r.barcode)))continue;seen.add(sku);if(r.barcode)barcodes.add(r.barcode);add.push({id:Math.max(0,...db.products.map(x=>Number(x.id)||0),...add.map(x=>Number(x.id)||0))+1,sku:r.sku,name:r.name,category:r.category_name||'ทั่วไป',barcode:r.barcode||'',unit:r.unit_name||'ชิ้น',cost:r.cost_price,price:r.sale_price,stock:r.opening_stock,min:r.low_stock_threshold,emoji:'🔧'})}if(!add.length)return toast('ไม่มีรายการใหม่ที่ไม่ซ้ำ');db.products.push(...add);save();closeModal();render();toast('นำเข้าสินค้าใหม่ '+add.length+' รายการแล้ว')}
function filterProducts(){let q=document.getElementById('productSearch').value.toLowerCase(),cat=document.getElementById('productCategory').value;document.getElementById('productsTable').innerHTML=productTable(db.products.filter(p=>(cat==='ทุกหมวดหมู่'||p.category===cat)&&(`${p.name} ${p.sku} ${p.category}`).toLowerCase().includes(q)))}

function openVariantModal(productId){openModal(`<h3>เพิ่มรุ่นสินค้าในการ์ดเดิม</h3><p class="settings-note">รุ่นใหม่จะใช้ชื่อการ์ดและรูปสินค้าร่วมกัน แต่มี SKU บาร์โค้ด ราคา และสต็อกแยกจากรุ่นอื่น</p><div class="form-grid"><div class="form-item"><label>SKU ของรุ่น *</label><input class="field" id="vSku" required></div><div class="form-item"><label>ชื่อรุ่น / ขนาด *</label><input class="field" id="vName" placeholder="เช่น 1/2 นิ้ว, 2 เมตร, สีขาว" required></div><div class="form-item"><label>หน่วยหลัก</label><input class="field" id="vUnit" value="ชิ้น"></div><div class="form-item"><label>บาร์โค้ด</label><input class="field" id="vBarcode"></div><div class="form-item"><label>ต้นทุน (บาท)</label><input class="field" id="vCost" type="number" min="0" step=".01" value="0"></div><div class="form-item"><label>ราคาขาย (บาท)</label><input class="field" id="vPrice" type="number" min="0" step=".01" value="0"></div><div class="form-item"><label>สต็อกเริ่มต้น</label><input class="field" id="vStock" type="number" min="0" step=".001" value="0"></div><div class="form-item"><label>แจ้งเตือนเมื่อเหลือ</label><input class="field" id="vMin" type="number" min="0" step=".001" value="0"></div></div><div class="modal-actions"><button class="btn-outline" onclick="closeModal()">ยกเลิก</button><button class="btn-primary" onclick="saveVariant('${esc(String(productId))}')">สร้างรุ่นสินค้า</button></div>`)}
async function saveVariant(productId){const payload={variant_sku:document.getElementById('vSku').value.trim(),variant_name:document.getElementById('vName').value.trim(),unit_name:document.getElementById('vUnit').value.trim()||'ชิ้น',barcode:document.getElementById('vBarcode').value.trim()||null,cost_price:Math.max(0,Number(document.getElementById('vCost').value)||0),sale_price:Math.max(0,Number(document.getElementById('vPrice').value)||0),opening_stock:Math.max(0,Number(document.getElementById('vStock').value)||0),low_stock_threshold:Math.max(0,Number(document.getElementById('vMin').value)||0)};if(!payload.variant_sku||!payload.variant_name)return toast('กรุณาระบุ SKU และชื่อรุ่น');try{await apiRequest('/api/v1/products/'+encodeURIComponent(productId)+'/variants',{method:'POST',body:JSON.stringify(payload)});await refreshApiData(false);closeModal();render();toast('เพิ่มรุ่นสินค้าเรียบร้อย')}catch(e){toast('เพิ่มรุ่นสินค้าไม่สำเร็จ: '+e.message)}}
async function saveProduct(id){let sku=document.getElementById('fSku').value.trim(),name=document.getElementById('fName').value.trim();if(!sku||!name)return toast('กรุณากรอกรหัสและชื่อสินค้า');if(db.products.some(p=>p.sku.toLowerCase()===sku.toLowerCase()&&String(p.id)!==String(id)))return toast('SKU นี้มีแล้ว');let vals={sku,name,category:document.getElementById('fCategory').value.trim()||'ทั่วไป',unit:document.getElementById('fUnit').value.trim()||'ชิ้น',cost:Math.max(0,Number(document.getElementById('fCost').value)||0),price:Math.max(0,Number(document.getElementById('fPrice').value)||0),stock:Math.max(0,Number(document.getElementById('fStock').value)||0),min:Math.max(0,Number(document.getElementById('fMin').value)||0),emoji:'🔧',barcode:document.getElementById('fBarcode').value.trim()};if(apiToken){try{const payload={sku:(db.products.find(p=>String(p.id)===String(id))?.productSku||sku),name,category_name:vals.category,variant_sku:sku,variant_name:(db.products.find(p=>String(p.id)===String(id))?.variantName||''),barcode:document.getElementById('fBarcode').value.trim()||null,unit_name:vals.unit,cost_price:vals.cost,sale_price:vals.price,low_stock_threshold:vals.min};if(id){await apiRequest('/api/v1/products/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(payload)});if(Number(document.getElementById('fStock').value)!==Number(db.products.find(p=>String(p.id)===String(id))?.stock))return toast('แก้ไขสินค้าแล้ว แต่การเปลี่ยนสต็อกต้องทำผ่านเมนูคลังสินค้า');}else{payload.opening_stock=vals.stock;await apiRequest('/api/v1/products',{method:'POST',body:JSON.stringify(payload)});}await refreshApiData(false);closeModal();render();toast(id?'แก้ไขสินค้าบนฐานข้อมูลแล้ว':'เพิ่มสินค้าลงฐานข้อมูลแล้ว')}catch(e){toast('บันทึกสินค้าไม่สำเร็จ: '+e.message)}return}if(id){Object.assign(db.products.find(p=>String(p.id)===String(id)),vals)}else db.products.push({id:Math.max(0,...db.products.map(x=>Number(x.id)||0))+1,...vals});save();closeModal();render();toast('บันทึกสินค้าแ async function saveStock(){let p=db.products.find(x=>String(x.id)===String(document.getElementById('stockProduct').value)),n=Number(document.getElementById('stockQty').value),t=document.getElementById('stockType').value;if(!p||!Number.isFinite(n)||n<0)return toast('จำนวนไม่ถูกต้อง');let delta=t==='add'?n:t==='remove'?-n:n-p.stock;if(t==='set'&&delta===0)return toast('ยอดสต็อกเท่าเดิม');if(p.stock+delta<0)return toast('สต็อกไม่เพียงพอ');if(apiToken){try{await apiRequest('/api/v1/inventory/adjustments',{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({variant_id:p.id,quantity_delta:delta,reason:document.getElementById('stockNote').value.trim()||'ปรับจากหน้า POS'})});await refreshApiData(false);closeModal();render();toast('ปรับสต็อกในฐานข้อมูลแล้ว')}catch(e){toast('ปรับสต็อกไม่สำเร็จ: '+e.message)}return}p.stock+=delta;save();closeModal();render();toast('ปรับสต็อกแล้ว')}

async function loadInventoryCounts(){try{const d=await apiRequest('/api/v1/inventory-counts');const el=document.getElementById('inventoryCountsList');if(!el)return;el.innerHTML=d.items.length?`<div class="table-wrap"><table><thead><tr><th>เลขที่รอบ</th><th>ชื่อรอบ / ตำแหน่ง</th><th>สถานะ</th><th>ตรวจแล้ว</th><th>วันที่</th><th></th></tr></thead><tbody>${d.items.map(x=>`<tr><td><strong>${esc(x.count_no)}</strong></td><td>${esc(x.title)}<div class="muted">${esc(x.location||'ทุกพื้นที่')}</div></td><td><span class="pill ${x.status==='rejected'?'bad':x.status==='submitted'?'warn':''}">${inventoryCountStatus(x.status)}</span></td><td>${x.counted_item_count}/${x.item_count}</td><td>${new Date(x.created_at).toLocaleString('th-TH')}</td><td><button class="btn-outline" onclick="openInventoryCount('${x.id}')">เปิด</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ยังไม่มีรอบตรวจนับ</div>';}catch(e){const el=document.getElementById('inventoryCountsList');if(el)el.innerHTML=`<div class="empty">โหลดรอบตรวจนับไม่สำเร็จ: ${esc(e.message)}</div>`}}
async function createInventoryCount(){const title=prompt('ชื่อรอบตรวจนับ เช่น นับคลังรอบเช้า');if(title===null)return;const location=prompt('ตำแหน่ง/ชั้นวาง (เว้นว่างได้)')||'';const reason=prompt('หมายเหตุ (เว้นว่างได้)')||'';try{const d=await apiRequest('/api/v1/inventory-counts',{method:'POST',body:JSON.stringify({title,location,reason})});activeInventoryCountId=d.count.id;toast('สร้างรอบตรวจนับแล้ว');await loadInventoryCounts();await openInventoryCount(activeInventoryCountId)}catch(e){toast('สร้างรอบตรวจนับไม่สำเร็จ: '+e.message)}}
async function openInventoryCount(id){activeInventoryCountId=id;const el=document.getElementById('inventoryCountDetail');if(!el)return;el.innerHTML='<div class="empty">กำลังโหลดรายละเอียด…</div>';try{const d=await apiRequest('/api/v1/inventory-counts/'+encodeURIComponent(id));const h=d.count,editable=h.status==='draft';el.innerHTML=`<div class="panel-title"><div><h4>${esc(h.count_no)} · ${esc(h.title)}</h4><p class="muted" style="font-size:12px;margin:5px 0">${esc(h.location||'ทุกพื้นที่')} · สร้างโดย ${esc(h.created_by_name||'ผู้ใช้')} · สถานะ ${inventoryCountStatus(h.status)}</p></div><button class="btn-outline" onclick="loadInventoryCounts();openInventoryCount('${id}')">รีเฟรช</button></div>${h.reason?`<p class="settings-note">หมายเหตุ: ${esc(h.reason)}</p>`:''}<div class="table-wrap"><table><thead><tr><th>สินค้า</th><th>ยอด ณ เริ่มรอบ</th><th>นับจริง</th><th>ผลต่าง</th>${editable?'<th></th>':''}</tr></thead><tbody>${d.items.map(i=>`<tr><td><strong>${esc(i.name)}</strong><div class="muted">${esc(i.sku)} · ${esc(i.variant_name||i.unit_name)}</div></td><td>${Number(i.snapshot_quantity).toLocaleString('th-TH')}</td><td>${editable?`<input class="field" style="width:110px" type="number" min="0" step="0.001" id="countqty_${i.item_id}" value="${i.counted_quantity===null?'':Number(i.counted_quantity)}" placeholder="จำนวนจริง">`:i.counted_quantity===null?'—':Number(i.counted_quantity).toLocaleString('th-TH')}</td><td>${i.difference===null?'—':`<strong style="color:${Number(i.difference)<0?'var(--red)':Number(i.difference)>0?'var(--green2)':'inherit'}">${Number(i.difference)>0?'+':''}${Number(i.difference).toLocaleString('th-TH')}</strong>`}</td>${editable?`<td><button class="btn-outline" onclick="saveInventoryCountItem('${id}','${i.item_id}')">บันทึก</button></td>`:''}</tr>`).join('')}</tbody></table></div>${editable?`<div class="toolbar" style="margin-top:16px"><button class="btn-primary" onclick="submitInventoryCount('${id}')">ส่งตรวจและขออนุมัติ</button><span class="settings-note">ต้องบันทึกจำนวนจริงครบทุกสินค้า</span></div>`:h.status==='submitted'&&['owner','manager'].includes(currentApiUser?.role)&&h.created_by!==currentApiUser?.id?`<div class="toolbar" style="margin-top:16px"><button class="btn-primary" onclick="decideInventoryCount('${id}','approved')">อนุมัติและปรับสต็อก</button><button class="btn-danger" onclick="decideInventoryCount('${id}','rejected')">ปฏิเสธ</button></div>`:h.status==='submitted'?'<p class="settings-note">รอเจ้าของร้านหรือผู้จัดการอีกคนตรวจสอบและอนุมัติ</p>':h.status==='approved'?`<p class="settings-note">อนุมัติโดย ${esc(h.decided_by_name||'ผู้จัดการ')} เมื่อ ${new Date(h.decided_at).toLocaleString('th-TH')} · ปรับสต็อกแล้ว</p>`:h.status==='rejected'?`<p class="settings-note">ปฏิเสธโดย ${esc(h.decided_by_name||'ผู้จัดการ')} · ${esc(h.decision_note||'ไม่มีหมายเหตุ')}</p>`:''}`;}catch(e){el.innerHTML=`<div class="empty">เปิดรอบตรวจนับไม่สำเร็จ: ${esc(e.message)}</div>`}}
async function saveInventoryCountItem(countId,itemId){const input=document.getElementById('countqty_'+itemId);if(!input||input.value==='')return toast('กรอกจำนวนที่นับได้ก่อน');try{await apiRequest(`/api/v1/inventory-counts/${countId}/items/${itemId}`,{method:'PATCH',body:JSON.stringify({counted_quantity:Number(input.value)})});toast('บันทึกจำนวนตรวจนับแล้ว');await openInventoryCount(countId);await loadInventoryCounts()}catch(e){toast('บันทึกไม่สำเร็จ: '+e.message)}}
async function submitInventoryCount(id){if(!confirm('ส่งรอบตรวจนับให้ผู้จัดการตรวจสอบหรือไม่? หลังส่งแล้วจะแก้จำนวนไม่ได้'))return;try{await apiRequest(`/api/v1/inventory-counts/${id}/submit`,{method:'POST',body:JSON.stringify({})});toast('ส่งรอบตรวจนับแล้ว');await loadInventoryCounts();await openInventoryCount(id)}catch(e){toast('ส่งรอบไม่สำเร็จ: '+e.message)}}
async function decideInventoryCount(id,decision){const note=prompt(decision==='approved'?'หมายเหตุการอนุมัติ (เว้นว่างได้)':'เหตุผลที่ปฏิเสธ');if(note===null)return;try{await apiRequest(`/api/v1/inventory-counts/${id}/decision`,{method:'POST',body:JSON.stringify({decision,note})});toast(decision==='approved'?'อนุมัติและปรับสต็อกแล้ว':'ปฏิเสธรอบตรวจนับแล้ว');await loadInventoryCounts();await openInventoryCount(id);await refreshApiData(false)}catch(e){toast('ดำเนินการไม่สำเร็จ: '+e.message)}}
function salesPage(c){c.innerHTML=`<div class="pagehead"><div><h3>ประวัติการขาย</h3><p>ตรวจสอบบิลขายที่บันทึกไว้ในอุปกรณ์นี้</p></div><button class="btn-outline" onclick="exportSales()">⇩ ส่งออก CSV</button></div><div class="panel"><div class="toolbar"><input class="field search" id="saleSearch" placeholder="ค้นหาเลขที่บิล / วิธีชำระเงิน..."><input class="field select" type="date" id="saleDate"></div><div id="salesTable">${salesTable([...db.sales].reverse())}</div></div>`;document.getElementById('saleSearch').oninput=filterSales;document.getElementById('saleDate').onchange=filterSales}
async function returnsPage(c){
 if(!apiToken){c.innerHTML=`<div class="pagehead"><div><h3>คืนสินค้า / คืนเงิน</h3><p>ค้นหาบิล เลือกรายการคืน และบันทึกคืนเงินพร้อมปรับสต็อก</p></div></div><section class="panel"><div class="empty"><span>🔐</span><strong>ต้องเชื่อมต่อฐานข้อมูลก่อน</strong><p>ระบบคืนสินค้าใช้ประวัติบิลและสต็อกบนเซิร์ฟเวอร์ ไม่สามารถทำรายการจริงในโหมดตัวอย่างบนอุปกรณ์นี้ได้</p><button class="btn-primary" onclick="go('settings')">ไปตั้งค่าการเชื่อมต่อ</button></div></section>`;return}
 c.innerHTML=`<div class="pagehead"><div><h3>คืนสินค้า / คืนเงิน</h3><p>ค้นหาบิลจากเลขที่บิล แล้วเลือกสินค้าที่ลูกค้านำมาคืน</p></div><button class="btn-outline" onclick="refreshApiData(false).then(()=>returnsPage(document.getElementById('content')))">↻ รีเฟรช</button></div><section class="panel"><div class="toolbar"><input class="field search" id="returnBillSearch" placeholder="ค้นหาเลขที่บิล..."><button class="btn-primary" onclick="lookupReturnBill()">ค้นหาบิล</button></div><p class="settings-note">คืนได้ไม่เกินจำนวนคงเหลือที่ยังไม่เคยคืน ระบบคำนวณยอดคืนจากยอดสุทธิของบิลและบันทึกประวัติการคืน</p><div id="returnLookupResult"><div class="empty">กรอกเลขที่บิลเพื่อเริ่มต้นคืนสินค้า</div></div></section><section class="panel" style="margin-top:18px"><div class="panel-title"><h4>บิลล่าสุด</h4><span class="muted" style="font-size:12px">เลือกบิลเพื่อดูรายการคืน</span></div>${db.sales.length?`<div class="table-wrap"><table><thead><tr><th>เลขที่บิล</th><th>วันที่</th><th>ยอดสุทธิ</th><th>ชำระแล้ว</th><th>สถานะ</th><th></th></tr></thead><tbody>${[...db.sales].slice(0,30).map(b=>`<tr><td><strong>${esc(b.no)}</strong></td><td>${new Date(b.date).toLocaleString('th-TH')}</td><td>฿${money(b.total)}</td><td>฿${money(b.received)}</td><td>${esc(returnBillStatus(b.status))}</td><td><button class="btn-soft" onclick="openReturnBill('${esc(b.id||b.no)}')">เปิดบิล</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ไม่พบบิลขาย กรุณาตรวจสอบการเชื่อมต่อ API</div>'}</section>`;
 document.getElementById('returnBillSearch').addEventListener('keydown',e=>{if(e.key==='Enter')lookupReturnBill()});
}
function returnBillStatus(s){return ({completed:'ขายสำเร็จ',partially_returned:'คืนบางส่วน',returned:'คืนครบแล้ว',voided:'ยกเลิกแล้ว'})[s]||s||'ไม่ทราบสถานะ'}
async function lookupReturnBill(){const value=document.getElementById('returnBillSearch')?.value.trim();if(!value)return toast('กรุณากรอกเลขที่บิล');await openReturnBill(value)}
async function openReturnBill(id){const target=document.getElementById('returnLookupResult');if(target)target.innerHTML='<div class="empty">กำลังค้นหาบิล…</div>';try{const data=await apiRequest('/api/v1/sales/'+encodeURIComponent(id));const bill=data.bill,returns=data.returns||[];const returned={};for(const ret of returns)for(const it of ret.items||[])returned[it.bill_item_id]=(returned[it.bill_item_id]||0)+Number(it.quantity||0);const rows=(bill.items||[]).map(it=>{const qty=Number(it.quantity),done=returned[it.id]||0;return {...it,returned:done,remaining:Math.max(0,qty-done)}});const html=`<div class="panel-title"><div><h4>บิล ${esc(bill.bill_no)}</h4><span class="muted" style="font-size:12px">${new Date(bill.created_at).toLocaleString('th-TH')} · ${esc(returnBillStatus(bill.status))}</span></div><button class="btn-primary" ${bill.status==='voided'||!rows.some(x=>x.remaining>0)?'disabled':''} onclick="openReturnModal('${esc(bill.id)}')">＋ ทำรายการคืน</button></div><div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat"><small>ยอดบิล</small><strong style="font-size:20px">฿${money(bill.total_amount)}</strong></div><div class="stat"><small>ชำระแล้ว</small><strong style="font-size:20px">฿${money(bill.paid_amount)}</strong></div><div class="stat"><small>ยอดคืนสะสม</small><strong style="font-size:20px">฿${money(returns.reduce((a,r)=>a+Number(r.refund_amount||0),0))}</strong></div></div><div class="table-wrap"><table><thead><tr><th>สินค้า</th><th>จำนวนซื้อ</th><th>คืนแล้ว</th><th>คืนได้อีก</th><th>ยอดต่อหน่วยโดยประมาณ</th></tr></thead><tbody>${rows.map(it=>`<tr><td><strong>${esc(it.name)}</strong><div class="muted">${esc(it.sku)} · ${esc(it.unit_name||'ชิ้น')}</div></td><td>${it.quantity}</td><td>${it.returned}</td><td><strong>${it.remaining}</strong></td><td>฿${money(Number(it.line_total||0)/Math.max(1,Number(it.quantity)))}</td></tr>`).join('')}</tbody></table></div>${returns.length?`<h4 style="margin:18px 0 8px">ประวัติคืนสินค้า</h4><div class="table-wrap"><table><thead><tr><th>เลขที่คืน</th><th>วันที่</th><th>เหตุผล</th><th>ยอดคืน</th><th>สถานะ</th></tr></thead><tbody>${returns.map(r=>`<tr><td>${esc(r.return_no)}</td><td>${new Date(r.created_at).toLocaleString('th-TH')}</td><td>${esc(r.reason)}</td><td>฿${money(r.refund_amount)}</td><td>${esc(r.status)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="settings-note">บิลนี้ยังไม่มีประวัติคืนสินค้า</p>'}`;const current=document.getElementById('returnLookupResult');if(current)current.innerHTML=html;window.currentReturnBillId=bill.id;window.currentReturnBillData=data;}catch(e){const current=document.getElementById('returnLookupResult');if(current)current.innerHTML=`<div class="empty"><span>⚠️</span>${esc(e.message)}<p>ตรวจสอบเลขที่บิลหรือสถานะการเชื่อมต่อ</p></div>`;}}
async function openReturnModal(id){try{const data=window.currentReturnBillData?.bill?.id===id?window.currentReturnBillData:await apiRequest('/api/v1/sales/'+encodeURIComponent(id));const bill=data.bill,returns=data.returns||[];const returned={};for(const ret of returns)for(const it of ret.items||[])returned[it.bill_item_id]=(returned[it.bill_item_id]||0)+Number(it.quantity||0);const rows=(bill.items||[]).map((it,i)=>({...it,remaining:Math.max(0,Number(it.quantity)-(returned[it.id]||0)),index:i})).filter(it=>it.remaining>0);if(!rows.length)return toast('บิลนี้ไม่มีสินค้าที่คืนได้');openModal(`<h3>คืนสินค้า · ${esc(bill.bill_no)}</h3><p class="settings-note">ระบุจำนวนคืนในแต่ละรายการ จำนวนต้องไม่เกินยอดที่ยังไม่คืน</p><div class="table-wrap"><table><thead><tr><th>สินค้า</th><th>ซื้อ</th><th>คืนได้</th><th>จำนวนคืน</th></tr></thead><tbody>${rows.map(it=>`<tr><td>${esc(it.name)}<div class="muted">${esc(it.sku)}</div></td><td>${it.quantity}</td><td>${it.remaining}</td><td><input class="field" style="min-width:86px" id="returnQty${it.index}" type="number" min="0" max="${it.remaining}" step="0.001" value="0" data-item-id="${esc(it.id)}" data-remaining="${it.remaining}"></td></tr>`).join('')}</tbody></table></div><div class="form-grid" style="margin-top:14px"><div class="form-item full"><label>เหตุผลการคืน *</label><input class="field" id="returnReason" placeholder="เช่น สินค้าผิดรุ่น / ชำรุด / ลูกค้าเปลี่ยนใจ"></div><div class="form-item full"><label>วิธีคืนเงิน</label><select class="field" id="returnMethod"><option value="cash">เงินสด (ต้องเปิดกะเงินสด)</option><option value="transfer">โอนเงิน</option><option value="other">วิธีอื่น</option></select></div></div><p class="settings-note">ยอดคืนจริงคำนวณและตรวจสอบซ้ำโดยเซิร์ฟเวอร์ก่อนบันทึก</p><div class="modal-actions"><button class="btn-outline" onclick="closeModal()">ยกเลิก</button><button class="btn-primary" onclick="submitSalesReturn('${esc(bill.id)}',${JSON.stringify(rows.map(it=>({id:it.id,remaining:it.remaining,index:it.index}))).replace(/"/g,'&quot;').replace(/</g,'&lt;')})">ยืนยันคืนสินค้า</button></div>`);}catch(e){toast('โหลดข้อมูลบิลไม่สำเร็จ: '+e.message)}}
async function submitSalesReturn(billId,rows){const reason=document.getElementById('returnReason').value.trim(),refund_method=document.getElementById('returnMethod').value;if(reason.length<2)return toast('กรุณาระบุเหตุผลการคืนสินค้า');const items=[];for(const row of rows){const el=document.getElementById('returnQty'+row.index),quantity=Number(el.value);if(!Number.isFinite(quantity)||quantity<0||quantity>row.remaining||!Number.isInteger(quantity*1000))return toast('จำนวนคืนไม่ถูกต้อง');if(quantity>0)items.push({bill_item_id:row.id,quantity});}if(!items.length)return toast('กรุณาระบุจำนวนคืนอย่างน้อย 1 รายการ');try{const result=await apiRequest('/api/v1/sales/'+encodeURIComponent(billId)+'/returns',{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({reason,refund_method,items})});await refreshApiData(false);closeModal();await returnsPage(document.getElementById('content'));await openReturnBill(billId);toast('บันทึกคืนสินค้าแล้ว · คืนเงิน ฿'+money(result.return?.refund_amount||0));}catch(e){toast('คืนสินค้าไม่สำเร็จ: '+e.message)}}
function filterSales(){let q=document.getElementById('saleSearch').value.toLowerCase(),d=document.getElementById('saleDate').value;let a=[...db.sales].reverse().filter(s=>(s.no+' '+s.payment).toLowerCase().includes(q)&&(!d||s.date.slice(0,10)===d));document.getElementById('salesTable').innerHTML=salesTable(a)}
function exportSales(){let rows=[['เลขที่บิล','วันที่','ยอดก่อนลด','ส่วนลด','ยอดสุทธิ','ชำระ'],...db.sales.map(s=>[s.no,s.date,s.subtotal,s.discount,s.total,s.payment])];downloadCSV('sales.csv',rows);toast('ส่งออก CSV แล้ว')}

function customersPage(c){c.innerHTML=`<div class="pagehead"><div><h3>ลูกค้าและเครดิต</h3><p>เก็บรายชื่อลูกค้าเพื่อใช้อ้างอิงบิลและงานขายเครดิตในอนาคต</p></div><button class="btn-primary" onclick="customerModal()">＋ เพิ่มลูกค้า</button></div><div class="panel"><div class="toolbar"><input class="field search" id="custSearch" placeholder="ค้นหาชื่อลูกค้า / เบอร์โทร..."></div><div id="custTable">${customerTable(db.customers)}</div></div>`;document.getElementById('custSearch').oninput=e=>document.getElementById('custTable').innerHTML=customerTable(db.customers.filter(x=>(x.name+' '+x.phone).toLowerCase().includes(e.target.value.toLowerCase())))}
function customerTable(rows){return rows.length?`<div class="table-wrap"><table><thead><tr><th>ชื่อลูกค้า</th><th>เบอร์โทร</th><th>ยอดเครดิต/หนี้คงค้าง</th><th>หมายเหตุ</th></tr></thead><tbody>${rows.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(x.phone||'-')}</td><td>฿${money(x.credit||0)}</td><td>${esc(x.note||'-')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ยังไม่มีลูกค้า</div>'}
function customerModal(){openModal(`<h3>เพิ่มลูกค้า</h3><div class="form-grid"><div class="form-item full"><label>ชื่อลูกค้า *</label><input class="field" id="cName"></div><div class="form-item"><label>เบอร์โทรศัพท์</label><input class="field" id="cPhone"></div><div class="form-item"><label>เครดิต/ยอดค้างเดิม (บาท)</label><input class="field" id="cCredit" type="number" min="0" value="0"></div><div class="form-item full"><label>หมายเหตุ</label><input class="field" id="cNote"></div></div><div class="modal-actions"><button class="btn-outline" onclick="closeModal()">ยกเลิก</button><button class="btn-primary" onclick="saveCustomer()">บันทึก</button></div>`)}
function saveCustomer(){let name=document.getElementById('cName').value.trim();if(!name)return toast('กรุณากรอกชื่อลูกค้า');db.customers.push({id:Math.max(0,...db.customers.map(x=>x.id))+1,name,phone:document.getElementById('cPhone').value.trim(),credit:Math.max(0,Number(document.getElementById('cCredit').value)||0),note:document.getElementById('cNote').value.trim()});save();closeModal();render();toast('เพิ่มลูกค้าแล้ว')}
function reportsPage(c){const to=new Date().toLocaleDateString('en-CA');const d=new Date();d.setDate(d.getDate()-29);const from=d.toLocaleDateString('en-CA');c.innerHTML=`<div class="pagehead"><div><h3>รายงานยอดขายและกระทบยอด</h3><p>รายงานจากฐานข้อมูลจริง รวมยอดคืนสินค้า วิธีชำระเงิน กะเงินสด และรับสินค้า</p></div><button class="btn-outline" id="exportReportBtn">⇩ ส่งออก CSV</button></div><section class="panel"><div class="toolbar"><div class="form-item"><label>ตั้งแต่วันที่</label><input class="field" id="reportFrom" type="date" value="${from}"></div><div class="form-item"><label>ถึงวันที่</label><input class="field" id="reportTo" type="date" value="${to}"></div><button class="btn-primary" id="loadReportBtn">ดูรายงาน</button></div><p id="reportStatus" class="settings-note">${apiToken?'กำลังโหลดรายงานจากฐานข้อมูล…':'ยังไม่ได้เชื่อมต่อ API รายงานนี้ต้องใช้ฐานข้อมูลจริง'}</p></section><div id="reportResults"></div>`;document.getElementById('loadReportBtn').onclick=()=>loadReports(document.getElementById('reportFrom').value,document.getElementById('reportTo').value);document.getElementById('exportReportBtn').onclick=exportReportCsv;if(apiToken)loadReports(from,to);else document.getElementById('reportResults').innerHTML='<section class="panel"><div class="empty"><span>📊</span><strong>เชื่อมต่อ API เพื่อดูรายงานจริง</strong><p>ไปที่ ตั้งค่าร้าน → เข้าสู่ระบบ API แล้วกลับมาหน้านี้</p><button class="btn-primary" onclick="go(\'settings\')">ไปตั้งค่าการเชื่อมต่อ</button></div></section>'}
async function loadReports(from,to){const status=document.getElementById('reportStatus'),root=document.getElementById('reportResults');if(!apiToken){status.textContent='กรุณาเชื่อมต่อ API ก่อน';return}if(!from||!to||from>to){status.textContent='กรุณาตรวจสอบช่วงวันที่';return}status.textContent='กำลังโหลดรายงาน…';root.innerHTML='';try{const r=await apiRequest(`/api/v1/reports/summary?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);window.currentReport=r;const s=r.summary||{};const payNames={cash:'เงินสด',transfer:'โอนเงิน',credit:'เครดิต',other:'อื่น ๆ'};root.innerHTML=`<div class="stats"><div class="stat"><div class="stat-top">ยอดขายสุทธิหลังคืน</div><strong>฿${money(s.net_sales)}</strong><small>ยอดขายก่อนคืน ฿${money(s.gross_sales)}</small></div><div class="stat"><div class="stat-top">จำนวนบิลขาย</div><strong>${Number(s.bill_count||0).toLocaleString('th-TH')}</strong><small>บิลยกเลิก ${Number(s.voided_bill_count||0)} บิล</small></div><div class="stat"><div class="stat-top">ยอดคืนเงิน</div><strong>฿${money(s.refund_total)}</strong><small>${Number(s.return_count||0)} รายการคืน</small></div><div class="stat"><div class="stat-top">กำไรขั้นต้นโดยประมาณ</div><strong style="font-size:21px">฿${money(s.gross_profit_estimate)}</strong><small>คำนวณจากต้นทุนในบิล ไม่ใช่บัญชีทางการ</small></div></div><div class="two-col"><section class="panel"><div class="panel-title"><h4>ยอดชำระแยกตามวิธี</h4></div>${r.payments?.length?r.payments.map(p=>`<div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)"><span>${esc(payNames[p.method]||p.method)} · ${p.bill_count} บิล</span><strong>฿${money(p.amount)}</strong></div>`).join(''):'<div class="empty">ไม่มีข้อมูลการชำระ</div>'}</section><section class="panel"><div class="panel-title"><h4>สรุปจัดซื้อ / รับสินค้า</h4></div><div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat"><small>ใบรับสินค้า</small><strong>${Number(r.purchases?.receipt_count||0)}</strong></div><div class="stat"><small>มูลค่ารับเข้า</small><strong>฿${money(r.purchases?.received_cost)}</strong></div></div><p class="settings-note">ยอดจัดซื้อแสดงตามวันที่รับสินค้าเสร็จสมบูรณ์</p></section></div><section class="panel"><div class="panel-title"><h4>ยอดขายรายวัน</h4></div>${r.daily?.length?`<div class="table-wrap"><table><thead><tr><th>วันที่</th><th style="text-align:right">ยอดขายก่อนคืน</th><th style="text-align:right">ยอดขายหลังคืน</th><th style="text-align:right">จำนวนบิล</th></tr></thead><tbody>${r.daily.map(x=>`<tr><td>${esc(x.day)}</td><td style="text-align:right">฿${money(x.gross_sales)}</td><td style="text-align:right"><strong>฿${money(x.net_sales)}</strong></td><td style="text-align:right">${x.bill_count}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ไม่มีข้อมูลในช่วงวันที่นี้</div>'}</section><section class="panel"><div class="panel-title"><h4>สินค้าขายดี 20 อันดับ</h4></div>${r.top_products?.length?`<div class="table-wrap"><table><thead><tr><th>SKU</th><th>สินค้า</th><th style="text-align:right">ขายได้</th><th style="text-align:right">คืน</th><th style="text-align:right">ยอดขาย</th><th style="text-align:right">ต้นทุน</th></tr></thead><tbody>${r.top_products.map(x=>`<tr><td>${esc(x.sku)}</td><td>${esc(x.name)}</td><td style="text-align:right">${x.sold_quantity}</td><td style="text-align:right">${x.returned_quantity}</td><td style="text-align:right">฿${money(x.gross_amount)}</td><td style="text-align:right">฿${money(x.cost_amount)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ไม่มีข้อมูลสินค้า</div>'}</section><section class="panel"><div class="panel-title"><h4>กระทบยอดกะเงินสด</h4></div>${r.shifts?.length?`<div class="table-wrap"><table><thead><tr><th>เลขที่กะ</th><th>สถานะ</th><th>เปิดเมื่อ</th><th style="text-align:right">ขายเงินสด</th><th style="text-align:right">คืนเงินสด</th><th style="text-align:right">คาดหมาย</th><th style="text-align:right">นับจริง</th><th style="text-align:right">ผลต่าง</th></tr></thead><tbody>${r.shifts.map(x=>`<tr><td>${esc(x.shift_no)}</td><td>${x.status==='open'?'เปิดอยู่':'ปิดแล้ว'}</td><td>${new Date(x.opened_at).toLocaleString('th-TH')}</td><td style="text-align:right">฿${money(x.cash_sales)}</td><td style="text-align:right">฿${money(x.cash_refunds)}</td><td style="text-align:right">฿${money(x.calculated_expected_cash??x.expected_cash)}</td><td style="text-align:right">${x.counted_cash==null?'—':'฿'+money(x.counted_cash)}</td><td style="text-align:right">${x.cash_difference==null?'—':'฿'+money(x.cash_difference)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ไม่มีกะที่เปิดในช่วงวันที่นี้</div>'}</section><p class="settings-note">รายงานนี้ใช้วันที่ตามเขตเวลาของ PostgreSQL/เซิร์ฟเวอร์ และยอดกำไรเป็นค่าประมาณจากต้นทุน ณ วันที่ขาย ไม่รวมค่าใช้จ่ายดำเนินงาน ภาษี และการปรับปรุงต้นทุนย้อนหลัง</p>`;status.textContent=`รายงานจากฐานข้อมูลสำเร็จ · ${from} ถึง ${to}`}catch(e){status.textContent='โหลดรายงานไม่สำเร็จ: '+e.message;root.innerHTML='<section class="panel"><div class="empty">ไม่สามารถโหลดรายงานจากเซิร์ฟเวอร์ได้</div></section>'}}
function exportReportCsv(){const r=window.currentReport;if(!r)return toast('กรุณาโหลดรายงานก่อนส่งออก');const rows=[['หมวด','วันที่/รหัส','รายละเอียด','จำนวน','มูลค่า','หมายเหตุ']];for(const x of r.daily||[])rows.push(['ยอดขายรายวัน',x.day,'ยอดขายสุทธิ',x.bill_count,x.net_sales,`ก่อนคืน ${x.gross_sales}`]);for(const x of r.payments||[])rows.push(['วิธีชำระ',x.method,'ยอดรับชำระ',x.bill_count,x.amount,'']);for(const x of r.top_products||[])rows.push(['สินค้าขายดี',x.sku,x.name,x.sold_quantity,x.gross_amount,`คืน ${x.returned_quantity}; ต้นทุน ${x.cost_amount}`]);for(const x of r.shifts||[])rows.push(['กะเงินสด',x.shift_no,x.status,x.counted_cash??'',x.cash_difference??'',`คาดหมาย ${x.expected_cash}; เปิด ${x.opened_at}`]);rows.push(['สรุป','',`ยอดขายสุทธิหลังคืน`,'',r.summary?.net_sales,'']);rows.push(['สรุป','','ยอดคืนเงิน','',r.summary?.refund_total,'']);const csv='\ufeff'+rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`hardware-pos-report-${r.from}-to-${r.to}.csv`;a.click();URL.revokeObjectURL(url)}
function purchaseStatus(s){return ({open:'รอรับสินค้า',partially_received:'รับบางส่วน',received:'รับครบแล้ว',cancelled:'ยกเลิก'})[s]||s}
async function shiftsPage(c){
 if(!apiToken){c.innerHTML=`<div class="pagehead"><div><h3>กะเงินสด / ปิดยอด</h3><p>เปิดกะ บันทึกเงินเข้าออก และกระทบยอดเงินสด</p></div></div><section class="panel"><div class="empty"><span>🔐</span><strong>ต้องเชื่อมต่อฐานข้อมูลก่อน</strong><p>การจัดการกะเงินสดบันทึกข้อมูลลงเซิร์ฟเวอร์ ไม่รองรับโหมดตัวอย่าง</p><button class="btn-primary" onclick="go('settings')">ไปตั้งค่าการเชื่อมต่อ</button></div></section>`;return}
 c.innerHTML=`<div class="pagehead"><div><h3>กะเงินสด / ปิดยอด</h3><p>ตรวจสอบเงินตั้งต้น ยอดเงินสดคาดหมาย รายการเข้าออก และผลต่างตอนปิดกะ</p></div><button class="btn-outline" onclick="shiftsPage(document.getElementById('content'))">↻ รีเฟรช</button></div><div id="shiftCurrent"><div class="panel empty">กำลังโหลดสถานะกะเงินสด…</div></div><section class="panel" style="margin-top:18px"><div class="panel-title"><h4>ประวัติกะเงินสด</h4></div><div id="shiftHistory"><div class="empty">กำลังโหลดประวัติ…</div></div></section>`;
 try{const [current,history]=await Promise.all([apiRequest('/api/v1/shifts/current'),apiRequest('/api/v1/shifts?limit=50')]);const root=document.getElementById('shiftCurrent');if(!root)return;
 if(!current.shift){root.innerHTML=`<section class="panel"><div class="empty"><span>💵</span><strong>ยังไม่มีกะเงินสดเปิดอยู่</strong><p>เปิดกะก่อนเริ่มรับชำระด้วยเงินสดหรือคืนเงินสด</p><button class="btn-primary" onclick="openShiftModal()">＋ เปิดกะเงินสด</button></div></section>`}else{const sh=current.shift;const mov=current.movements||[];root.innerHTML=`<section class="panel"><div class="pagehead"><div><h4 style="margin:0">กะ ${esc(sh.shift_no)}</h4><p>เปิดเมื่อ ${new Date(sh.opened_at).toLocaleString('th-TH')} · ${esc(sh.opened_by_name||'ผู้ใช้งาน')}</p></div><span class="pill">กำลังเปิด</span></div><div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat"><small>เงินตั้งต้น</small><strong style="font-size:22px">฿${money(sh.opening_cash)}</strong></div><div class="stat"><small>เงินสดคาดหมาย</small><strong style="font-size:22px">฿${money(sh.calculated_expected_cash)}</strong></div><div class="stat"><small>รายการเงินสด</small><strong style="font-size:22px">${sh.movement_count||0}</strong></div></div><div class="toolbar"><button class="btn-primary" onclick="cashMovementModal('${sh.id}','cash_in')">＋ เงินสดเข้า</button><button class="btn-outline" onclick="cashMovementModal('${sh.id}','cash_out')">− เงินสดออก</button><button class="btn-danger" onclick="closeShiftModal('${sh.id}',${Number(sh.calculated_expected_cash||0)})">ปิดกะและนับเงิน</button></div><h4 style="margin:18px 0 8px">ความเคลื่อนไหวล่าสุด</h4>${mov.length?`<div class="table-wrap"><table><thead><tr><th>วันเวลา</th><th>รายการ</th><th>หมายเหตุ</th><th style="text-align:right">จำนวนเงิน</th></tr></thead><tbody>${mov.map(m=>`<tr><td>${new Date(m.occurred_at).toLocaleString('th-TH')}</td><td>${esc(cashMovementLabel(m.movement_type))}</td><td>${esc(m.note||'—')}</td><td style="text-align:right">฿${money(m.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ยังไม่มีรายการเงินสดในกะนี้</div>'}</section>`}
 const h=document.getElementById('shiftHistory');if(h)h.innerHTML=history.items?.length?`<div class="table-wrap"><table><thead><tr><th>เลขที่กะ</th><th>เปิดเมื่อ</th><th>ปิดเมื่อ</th><th>เงินคาดหมาย</th><th>นับได้จริง</th><th>ผลต่าง</th><th>สถานะ</th></tr></thead><tbody>${history.items.map(sh=>`<tr><td><strong>${esc(sh.shift_no)}</strong></td><td>${new Date(sh.opened_at).toLocaleString('th-TH')}</td><td>${sh.closed_at?new Date(sh.closed_at).toLocaleString('th-TH'):'—'}</td><td>฿${money(sh.expected_cash??sh.calculated_expected_cash)}</td><td>${sh.counted_cash==null?'—':'฿'+money(sh.counted_cash)}</td><td>${sh.cash_difference==null?'—':`<strong style="color:${Number(sh.cash_difference)===0?'var(--green)':'var(--red)'}">฿${money(sh.cash_difference)}</strong>`}</td><td><span class="pill ${sh.status==='open'?'warn':''}">${sh.status==='open'?'เปิดอยู่':'ปิดแล้ว'}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ยังไม่มีประวัติกะเงินสด</div>';
 }catch(e){const root=document.getElementById('shiftCurrent');if(root)root.innerHTML=`<section class="panel"><div class="empty"><span>⚠️</span>โหลดข้อมูลกะเงินสดไม่สำเร็จ<p>${esc(e.message)}</p><button class="btn-primary" onclick="shiftsPage(document.getElementById('content'))">ลองอีกครั้ง</button></div></section>`}
}
function cashMovementLabel(type){return ({opening_float:'เงินตั้งต้นกะ',sale_cash:'รับเงินสดจากการขาย',refund_cash:'คืนเงินสด',cash_in:'เงินสดเข้า',cash_out:'เงินสดออก',customer_payment_cash:'รับชำระหนี้เงินสด',closing_adjustment:'ปรับยอดปิดกะ'})[type]||type}
function openShiftModal(){openModal(`<h3>เปิดกะเงินสด</h3><div class="form-grid"><div class="form-item full"><label>เงินสดตั้งต้น (บาท)</label><input class="field" id="shiftOpeningCash" type="number" min="0" step="0.01" value="0"></div><div class="form-item full"><label>หมายเหตุ (ถ้ามี)</label><input class="field" id="shiftOpeningNote" maxlength="500" placeholder="เช่น เงินทอนเริ่มต้นกะเช้า"></div></div><div class="modal-actions"><button class="btn-outline" onclick="closeModal()">ยกเลิก</button><button class="btn-primary" onclick="submitOpenShift()">เปิดกะ</button></div>`)}
async function submitOpenShift(){const opening_cash=Number(document.getElementById('shiftOpeningCash').value),note=document.getElementById('shiftOpeningNote').value.trim();if(!Number.isFinite(opening_cash)||opening_cash<0||Math.round(opening_cash*100)!==opening_cash*100)return toast('จำนวนเงินตั้งต้นไม่ถูกต้อง');try{await apiRequest('/api/v1/shifts/open',{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({opening_cash,note})});closeModal();await shiftsPage(document.getElementById('content'));toast('เปิดกะเงินสดแล้ว')}catch(e){toast('เปิดกะไม่สำเร็จ: '+e.message)}}
function cashMovementModal(shiftId,type){openModal(`<h3>${type==='cash_in'?'บันทึกเงินสดเข้า':'บันทึกเงินสดออก'}</h3><div class="form-grid"><div class="form-item full"><label>จำนวนเงิน (บาท)</label><input class="field" id="cashMoveAmount" type="number" min="0.01" step="0.01"></div><div class="form-item full"><label>เหตุผล / หมายเหตุ *</label><input class="field" id="cashMoveNote" maxlength="500" placeholder="เช่น เติมเงินทอน / จ่ายค่าขนส่ง"></div></div><div class="modal-actions"><button class="btn-outline" onclick="closeModal()">ยกเลิก</button><button class="btn-primary" onclick="submitCashMovement('${shiftId}','${type}')">บันทึก</button></div>`)}
async function submitCashMovement(shiftId,type){const amount=Number(document.getElementById('cashMoveAmount').value),note=document.getElementById('cashMoveNote').value.trim();if(!Number.isFinite(amount)||amount<=0||Math.round(amount*100)!==amount*100||note.length<2)return toast('ตรวจสอบจำนวนเงินและเหตุผล');try{await apiRequest(`/api/v1/shifts/${encodeURIComponent(shiftId)}/movements`,{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({movement_type:type,amount,note})});closeModal();await shiftsPage(document.getElementById('content'));toast('บันทึกความเคลื่อนไหวเงินสดแล้ว')}catch(e){toast('บันทึกไม่สำเร็จ: '+e.message)}}
function closeShiftModal(shiftId,expected){window.currentShiftExpected=Number(expected)||0;openModal(`<h3>ปิดกะและกระทบยอด</h3><p class="settings-note">ยอดเงินสดคาดหมายจากระบบ: <strong>฿${money(expected)}</strong>. กรุณานับเงินสดจริงในลิ้นชักแล้วระบุยอด</p><div class="form-grid"><div class="form-item full"><label>เงินสดที่นับได้จริง (บาท)</label><input class="field" id="shiftCountedCash" type="number" min="0" step="0.01" value="${Number(expected).toFixed(2)}"></div><div class="form-item full"><label>หมายเหตุผลต่าง (ถ้ามี)</label><input class="field" id="shiftCloseNote" maxlength="500" placeholder="ระบุสาเหตุหากเงินขาดหรือเกิน"></div></div><div class="modal-actions"><button class="btn-outline" onclick="closeModal()">กลับ</button><button class="btn-danger" onclick="submitCloseShift('${shiftId}')">ยืนยันปิดกะ</button></div>`)}
async function submitCloseShift(shiftId){const counted_cash=Number(document.getElementById('shiftCountedCash').value),note=document.getElementById('shiftCloseNote').value.trim();if(!Number.isFinite(counted_cash)||counted_cash<0||Math.round(counted_cash*100)!==counted_cash*100)return toast('ยอดเงินที่นับไม่ถูกต้อง');if(Math.abs(counted_cash-Number(window.currentShiftExpected||counted_cash))>0.01&&!note)return toast('หากเงินขาดหรือเกิน กรุณาระบุหมายเหตุ');try{const result=await apiRequest(`/api/v1/shifts/${encodeURIComponent(shiftId)}/close`,{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({counted_cash,note})});closeModal();await shiftsPage(document.getElementById('content'));toast(`ปิดกะแล้ว · ผลต่าง ฿${money(result.reconciliation?.cash_difference||0)}`)}catch(e){toast('ปิดกะไม่สำเร็จ: '+e.message)}}
async function purchasingPage(c){
 if(!apiToken){c.innerHTML=`<div class="pagehead"><div><h3>จัดซื้อและรับสินค้า</h3><p>สร้างใบสั่งซื้อ รับสินค้าเข้าคลัง และตรวจสอบประวัติรับสินค้า</p></div></div><section class="panel"><div class="empty"><span>🔐</span><strong>ต้องเชื่อมต่อฐานข้อมูลก่อน</strong><p>เปิดเมนูตั้งค่าร้าน แล้วเข้าสู่ระบบ API เพื่อใช้ระบบจัดซื้อจริง</p><button class="btn-primary" onclick="go('settings')">ไปตั้งค่าการเชื่อมต่อ</button></div></section>`;return}

 try{const [sup,orders,receipts]=await Promise.all([apiRequest('/api/v1/suppliers'),apiRequest('/api/v1/purchase-orders'),apiRequest('/api/v1/purchase-receipts')]);purchaseSuppliers=sup.items||[];purchaseOrders=orders.items||[];purchaseReceipts=receipts.items||[];
 const open=purchaseOrders.filter(x=>['open','partially_received'].includes(x.status));const pending=open.reduce((n,o)=>n+(o.items||[]).reduce((m,i)=>m+Math.max(0,Number(i.quantity_ordered)-Number(i.quantity_received)),0),0);const totalValue=purchaseReceipts.reduce((n,r)=>n+Number(r.total_cost||0),0);
 c.innerHTML=`<div class="pagehead"><div><h3>จัดซื้อและรับสินค้า</h3><p>จัดการผู้จำหน่าย ใบสั่งซื้อ และรับสินค้าเข้าสต็อกผ่านฐานข้อมูล</p></div><div class="toolbar" style="margin:0"><button class="btn-outline" onclick="supplierModal()">＋ ผู้จำหน่าย</button><button class="btn-primary" onclick="purchaseOrderModal()">＋ สร้างใบสั่งซื้อ</button></div></div>
 <div class="stats"><div class="stat"><div class="stat-top">ใบสั่งซื้อที่ยังไม่รับครบ <span class="stat-icon">📋</span></div><strong>${open.length}</strong><small>รอรับหรือรับบางส่วน</small></div><div class="stat"><div class="stat-top">จำนวนหน่วยค้างรับ <span class="stat-icon">📦</span></div><strong>${pending.toLocaleString('th-TH',{maximumFractionDigits:3})}</strong><small>รวมทุกใบสั่งซื้อ</small></div><div class="stat"><div class="stat-top">ผู้จำหน่าย <span class="stat-icon">🚚</span></div><strong>${purchaseSuppliers.length}</strong><small>รายชื่อที่เปิดใช้งาน</small></div><div class="stat"><div class="stat-top">มูลค่ารับเข้าสะสม <span class="stat-icon">฿</span></div><strong style="font-size:21px">฿${money(totalValue)}</strong><small>จากประวัติรับสินค้า</small></div></div>
 <section class="panel" style="margin-bottom:18px"><div class="panel-title"><h4>ใบสั่งซื้อ</h4><button class="btn-outline" onclick="purchasingPage(document.getElementById('content'))">↻ รีเฟรช</button></div>${purchaseOrders.length?`<div class="table-wrap"><table><thead><tr><th>เลขที่ใบสั่งซื้อ</th><th>ผู้จำหน่าย</th><th>วันที่</th><th>รายการ</th><th>สถานะ</th><th>การทำงาน</th></tr></thead><tbody>${purchaseOrders.map(o=>`<tr><td><strong>${esc(o.po_no)}</strong></td><td>${esc(o.supplier_name||'ไม่ระบุ')}</td><td>${new Date(o.created_at).toLocaleDateString('th-TH')}</td><td>${(o.items||[]).length} รายการ</td><td><span class="pill ${o.status==='received'?'':o.status==='partially_received'?'warn':o.status==='cancelled'?'bad':'warn'}">${purchaseStatus(o.status)}</span></td><td>${['open','partially_received'].includes(o.status)?`<button class="btn-soft" onclick="receiveOrder('${o.id}')">รับสินค้า</button>`:`<span class="muted">—</span>`}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><span>📋</span>ยังไม่มีใบสั่งซื้อ กด “สร้างใบสั่งซื้อ” เพื่อเริ่มต้น</div>'}</section>
